name: 3-terminale
# Dopo ogni snapshot notturno riuscito: ricostruisce il database da tutti i CSV
# e pubblica il terminale su GitHub Pages. Si può lanciare anche a mano.
on:
  workflow_run:
    workflows: ["analyst-snapshot"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: terminale
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests scikit-learn "yfinance>=0.2.54"
      - name: Storico completo rating e 10 anni di prezzi (solo la prima volta)
        run: python backfill_history.py
        continue-on-error: true
      - name: Database
        run: python build_db.py
      - name: Classifica broker
        run: python score_brokers.py
        continue-on-error: true
      - name: Investitori istituzionali (rating e pagine)
        run: if [ -d data/13f/holdings ]; then python inst_score.py; else echo "13F non ancora scaricati"; fi
        continue-on-error: true
      - run: cp build/analyst.db site/
      - name: Salva storici (salute pipeline, classifica broker, rating e prezzi)
        run: |
          git config user.name analyst-snapshot; git config user.email actions@github.com
          git add data/health_history.csv
          for f in data/13f/ranking.csv data/broker_ranking_history.csv data/prices_backfill.csv.gz data/ratings_backfill.csv.gz data/prices_backfill_us.csv.gz data/ratings_backfill_us.csv.gz; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "storici-$(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && exit 0; sleep 10; done; exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
