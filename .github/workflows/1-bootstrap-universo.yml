name: 1-bootstrap-universo
# Ricostruisce l'universo (S&P 500, FTSE 100/250, FTSE MIB, DAX, CAC 40, Euro Stoxx 50)
# e completa nome, ISIN, valuta e borsa. Da lanciare a mano quando cambiano gli indici.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas lxml html5lib requests "yfinance>=0.2.54"
      - name: Universo
        run: python build_universe.py
      - name: Nome, ISIN, valuta
        run: python enrich_universe.py --max 2000
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name analyst-snapshot; git config user.email actions@github.com
          git add universe.csv
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "universo $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && exit 0; sleep 10; done; exit 1
