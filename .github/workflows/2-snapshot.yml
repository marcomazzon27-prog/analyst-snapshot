{"name": "analyst-snapshot", "on": {"schedule": [{"cron": "30 5 * * 1-5"}], "workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"collect": {"runs-on": "ubuntu-latest", "timeout-minutes": 50, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"run": "pip install yfinance pandas lxml html5lib pyarrow"}, {"name": "Snapshot", "run": "python collect.py --universe universe.csv --out data"}, {"name": "Commit", "run": "git config user.name analyst-snapshot; git config user.email actions@github.com; git add data; if git diff --staged --quiet; then echo nessuna-modifica; exit 0; fi; git commit -m snapshot-$(date -u +%F); for i in 1 2 3 4 5; do if git pull --rebase --autostash origin main && git push; then exit 0; fi; sleep 15; done; exit 1"}]}}}
