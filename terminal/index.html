<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ASNP — Analyst Snapshot Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --panel:#0A0A0A; --line:#262626; --amber:#F4A300; --amber-dim:#8C6A2A;
  --txt:#E4E4E4; --dim:#8A8A8A; --up:#2BD46A; --dn:#FF4136; --tick:#5CC8FF; --sel:#15356E;
  --warn:#FFD23F; --bar-txt:#000000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
  font:13px/1.45 "IBM Plex Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--tick)}
:focus-visible{outline:1px solid var(--amber);outline-offset:1px}

/* command line */
#top{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
#brand{background:var(--amber);color:var(--bar-txt);font-weight:600;padding:6px 10px;letter-spacing:.02em}
#cmdwrap{flex:1 1 260px;display:flex;align-items:center;position:relative;min-width:200px}
#cmdwrap::before{content:">";color:var(--amber);padding:0 6px 0 10px}
#cmd{flex:1;background:transparent;border:0;color:var(--warn);text-transform:uppercase;padding:6px 0;outline:none;caret-color:var(--amber)}
#go{background:#1E7A2E;color:#fff;border:0;padding:0 12px;cursor:pointer;font-weight:600}
#go:hover{background:#26963A}
#sugg{position:absolute;left:24px;top:100%;background:#111;border:1px solid var(--amber-dim);min-width:320px;display:none;z-index:9}
#sugg div{padding:2px 8px;cursor:pointer;white-space:nowrap}
#sugg div.on,#sugg div:hover{background:var(--sel)}
#clock{display:flex;gap:14px;align-items:center;padding:0 10px;color:var(--dim);white-space:nowrap}
#clock b{color:var(--txt);font-weight:500}
.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* function keys */
#fkeys{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:#050505}
#fkeys button{background:transparent;border:0;border-right:1px solid var(--line);padding:4px 10px;cursor:pointer;white-space:nowrap;color:var(--dim)}
#fkeys button span{color:var(--amber);margin-right:6px}
#fkeys button[aria-current="true"]{background:var(--sel);color:var(--txt)}
#fkeys button:hover{color:var(--txt)}

main{padding:8px 10px 60px;max-width:1500px}
.bar{background:var(--amber);color:var(--bar-txt);font-weight:600;padding:2px 8px;display:flex;justify-content:space-between;gap:12px;margin-top:12px}
.bar:first-child{margin-top:0}
.bar small{font-weight:400}
.sub{color:var(--dim);padding:4px 0 6px}
.ctrl{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 0;color:var(--dim)}
.ctrl .opt{cursor:pointer;padding:0 5px;border:1px solid transparent;background:none;color:var(--dim)}
.ctrl .opt[aria-pressed="true"]{color:var(--bar-txt);background:var(--amber)}
.ctrl .opt:hover{border-color:var(--amber-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0 18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{color:var(--amber);font-weight:500;text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
td{padding:1px 8px 1px 0;border-bottom:1px solid #111}
th.n,td.n{text-align:right}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--sel)}
td.idx{color:var(--amber);width:1%;padding-right:10px}
.t{color:var(--tick)}
.up{color:var(--up)} .dn{color:var(--dn)} .dim{color:var(--dim)} .w{color:var(--warn)} .a{color:var(--amber)}
.tag{display:inline-block;min-width:54px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:1px 14px;padding:4px 0}
.kv dt{color:var(--amber)} .kv dd{margin:0}
.big{font-size:22px;line-height:1.1;font-weight:500}
.hdr{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:baseline;padding:6px 0 2px}
.dist{letter-spacing:-1px}
.note{border-left:2px solid var(--warn);padding:4px 10px;margin:8px 0;color:var(--txt);background:#0d0b00}
svg text{font-family:inherit;font-size:11px;fill:var(--dim)}
#status{position:fixed;left:0;right:0;bottom:0;background:#050505;border-top:1px solid var(--line);
  padding:3px 10px calc(3px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px}
#msg{color:var(--warn)}
@media (max-width:640px){ #clock .opt-hide{display:none} .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <div id="brand">ASNP</div>
  <div id="cmdwrap">
    <input id="cmd" autocomplete="off" spellcheck="false" aria-label="Comando: ticker e funzione, es. AAPL ANR" placeholder="AAPL US ANR · MOV · REV · HELP">
    <div id="sugg" role="listbox"></div>
  </div>
  <button id="go" title="Esegui (Invio)">&lt;GO&gt;</button>
  <div id="clock"><span id="lampwrap"></span><span class="opt-hide">Dati al <b id="asof">—</b></span><span id="now"></span></div>
</header>
<nav id="fkeys"></nav>
<main id="screen"><div class="sub">Caricamento dati…</div></main>
<footer id="status"><span id="msg"></span><span>Rassegna di ciò che è successo. Non è una raccomandazione e non è un segnale.</span></footer>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>s==null?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FUN=[["MOV","Movimenti"],["REV","Revisioni"],["ANR","Titolo"],["BRK","Broker"],["WL","Watchlist"],["HLTH","Pipeline"],["DB","Database"],["HELP","Aiuto"]];
const CAT={DBL_UP:["2×UP",0,"up"],DBL_DN:["2×DN",0,"dn"],BH_UP:["B/H ▲",1,"up"],BH_DN:["B/H ▼",1,"dn"],
           HS_UP:["H/S ▲",1,"up"],HS_DN:["H/S ▼",1,"dn"],UP:["UP",3,"up"],DN:["DN",3,"dn"],INIT:["INIT",4,"a"],
           MAIN:["MAIN",5,"dim"],REIT:["REIT",5,"dim"],OTHER:["—",5,"dim"]};
const GR={1:"Strong Buy",2:"Buy",3:"Hold",4:"Underperf.",5:"Sell"};
let D,EV=[],BY={},ASOF,state={fn:"MOV",arg:null,rows:[]},hist=[];

/* ---------- data ---------- */
async function load(){
  let raw=window.__DATA__;
  if(!raw){ try{ const r=await fetch("terminal.json",{cache:"no-cache"}); if(!r.ok)throw new Error("HTTP "+r.status); raw=await r.json(); }
    catch(e){ $("#screen").innerHTML=`<div class="bar">ERRORE DATI</div><p>terminal.json non raggiungibile (${esc(e.message)}). Il sito si pubblica dopo il primo run di build_db.py su GitHub Actions.</p>`; return; } }
  D=raw; ASOF=D.meta.as_of;
  EV=D.events.map(r=>({t:r[0],d:r[1],b:D.brokers[r[2]]??"?",a:r[3]||"",rf:r[4],rt:r[5],fn:r[6],tn:r[7],fs:r[8],bf:r[9]}));
  EV.forEach(e=>{e.c=cat(e);(BY[e.t]=BY[e.t]||[]).push(e)});
  $("#asof").textContent=ASOF||"—"; lamp(); tick(); setInterval(tick,30000);
  keys(); const h=decodeURIComponent(location.hash.slice(1)); run(h||"MOV",true);
}
function cat(e){const f=e.fn,t=e.tn;
  if(f!=null&&t!=null&&Math.abs(t-f)>=2)return t<f?"DBL_UP":"DBL_DN";
  if(f!=null&&t!=null){ if(f<=2&&t>=3)return"BH_DN"; if(f>=3&&t<=2)return"BH_UP"; if(f<=3&&t>=4)return"HS_DN"; if(f>=4&&t<=3)return"HS_UP"; }
  if(e.a==="up")return"UP"; if(e.a==="down")return"DN"; if(e.a==="init")return"INIT"; if(e.a==="main")return"MAIN"; if(e.a==="reit")return"REIT"; return"OTHER";}
const dir=e=>CAT[e.c][2]==="up"?1:CAT[e.c][2]==="dn"?-1:0;
function bdBack(iso,n){const d=new Date(iso+"T00:00:00Z");while(n>0){d.setUTCDate(d.getUTCDate()-1);const w=d.getUTCDay();if(w&&w<6)n--;}return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
const panel=t=>(D.universe[t]||["?"])[0];
function lamp(){const s=D.snapshots.at(-1)||[];const n=new Date();let d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()));
  const wk=x=>{const w=x.getUTCDay();return w>0&&w<6};
  if(!(wk(d)&&n.getUTCHours()>=7)){do{d.setUTCDate(d.getUTCDate()-1)}while(!wk(d))}
  const expected=d.toISOString().slice(0,10),stale=!ASOF||ASOF<expected,bad=(s[2]||0)>0;
  const col=stale?"var(--dn)":bad?"var(--warn)":"var(--up)";
  $("#lampwrap").innerHTML=`<span class="lamp" style="background:${col}"></span>${stale?"Dati fermi al "+(ASOF||"—"):bad?"Run con errori":"Pipeline ok"}`;}
function tick(){const d=new Date();$("#now").textContent=d.toLocaleString("it-IT",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function msg(s){$("#msg").textContent=s||""}

/* ---------- command line ---------- */
function keys(){
  $("#fkeys").innerHTML=FUN.map(([f,l],i)=>`<button data-f="${f}"><span>F${i+1}</span>${f} ${l}</button>`).join("");
  $("#fkeys").onclick=e=>{const b=e.target.closest("button");if(b)run(b.dataset.f==="ANR"&&state.arg&&state.fn==="ANR"?"ANR "+state.arg:b.dataset.f)};
  const cmd=$("#cmd"),sg=$("#sugg");let sel=-1;
  cmd.addEventListener("input",()=>{const v=cmd.value.trim().toUpperCase();sel=-1;
    if(v.length<1||/\s/.test(v)||/^\d+$/.test(v)){sg.style.display="none";return}
    const tk=Object.keys(D.universe).filter(t=>t.startsWith(v)||t.replace(".L","")===v).slice(0,8);
    const fx=FUN.filter(f=>f[0].startsWith(v)).map(f=>f[0]);
    const items=[...fx.map(f=>[f,FUN.find(x=>x[0]===f)[1]]),...tk.map(t=>[t+" ANR",`${D.universe[t][0]} ${D.universe[t][1]} · ${(BY[t]||[]).length} eventi`])];
    sg.innerHTML=items.map(([c,l],i)=>`<div data-c="${esc(c)}" role="option"><span class="w">${esc(c)}</span> <span class="dim">${esc(l)}</span></div>`).join("");
    sg.style.display=items.length?"block":"none";});
  sg.onclick=e=>{const d=e.target.closest("div[data-c]");if(d){run(d.dataset.c);}};
  cmd.addEventListener("keydown",e=>{const it=[...sg.querySelectorAll("div[data-c]")];
    if(e.key==="ArrowDown"&&it.length){e.preventDefault();sel=(sel+1)%it.length}
    else if(e.key==="ArrowUp"&&it.length){e.preventDefault();sel=(sel-1+it.length)%it.length}
    else if(e.key==="Enter"){e.preventDefault();run(sel>=0&&it[sel]?it[sel].dataset.c:cmd.value);return}
    else if(e.key==="Escape"){cmd.value="";sg.style.display="none";return}
    else return;
    it.forEach((d,i)=>d.classList.toggle("on",i===sel));});
  $("#go").onclick=()=>run(cmd.value);
  document.addEventListener("keydown",e=>{
    if(/^F[1-8]$/.test(e.key)){e.preventDefault();run(FUN[+e.key.slice(1)-1][0]);return}
    if(e.key==="Escape"&&document.activeElement!==cmd){back();return}
    if(document.activeElement===cmd||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key.length===1&&/[\w.]/.test(e.key)){cmd.focus()}});
  $("#screen").addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)run(g.dataset.go);
    const o=e.target.closest("[data-set]");if(o){const[k,v]=o.dataset.set.split("=");opts[k]=isNaN(+v)?v:+v;LS.set("asnp.opts",opts);render()}});
}
function back(){hist.pop();const p=hist.pop();if(p)run(p)}
function norm(tk){tk=tk.toUpperCase();if(D.universe[tk])return tk;if(D.universe[tk+".L"])return tk+".L";return null}
function run(raw,init){
  $("#sugg").style.display="none";const cmd=$("#cmd");
  let s=(raw||"").toUpperCase().replace(/<GO>/g,"").replace(/\bEQUITY\b/g,"").trim().replace(/\s+/g," ");
  if(!s)return;
  if(/^\d+$/.test(s)){const r=state.rows[+s-1];if(r){s=r}else{msg(`Riga ${s} non presente in questa schermata.`);cmd.value="";return}}
  let p=s.split(" "),fn=null,arg=null;
  const fi=p.findIndex(x=>FUN.some(f=>f[0]===x)||x==="WL+"||x==="WL-");
  if(fi>=0){fn=p[fi];p.splice(fi,1)}
  if(p.length){ if(fn==="BRK"){arg=p.join(" ")} else {
    let t=p[0];if(p[1]==="LN")t=t+".L";const n=norm(t);if(!n){msg(`Ticker ${p[0]} non nell'universo.`);return}arg=n;if(!fn)fn="ANR"} }
  if(fn==="WL+"||fn==="WL-"){ if(!arg){msg("Serve un ticker: es. AAPL WL+");return}
    const wl=new Set(LS.get("asnp.wl",[]));fn==="WL+"?wl.add(arg):wl.delete(arg);LS.set("asnp.wl",[...wl]);msg(`${arg} ${fn==="WL+"?"aggiunto alla":"tolto dalla"} watchlist.`);fn="ANR"}
  if(fn==="ANR"&&!arg){arg=state.fn==="ANR"?state.arg:null;if(!arg){msg("ANR richiede un ticker: es. MSFT ANR");fn="HELP"}}
  state={fn,arg,rows:[]};const key=(arg?arg+" ":"")+fn;hist.push(key);
  if(!init)history.replaceState(null,"","#"+encodeURIComponent(key));
  cmd.value="";if(!init)msg("");render();window.scrollTo(0,0);
}
let opts=Object.assign({win:1,pan:"ALL",main:0,fy:1,minr:3,bwin:90},LS.get("asnp.opts",{}));
function render(){
  document.querySelectorAll("#fkeys button").forEach(b=>b.setAttribute("aria-current",b.dataset.f===state.fn));
  state.rows=[];const f={MOV,REV,ANR,BRK,WL,HLTH,DB,HELP}[state.fn]||HELP;$("#screen").innerHTML=f(state.arg);}
const R=go=>{state.rows.push(go);return state.rows.length};
const optBtns=(k,list)=>list.map(([v,l])=>`<button class="opt" data-set="${k}=${v}" aria-pressed="${opts[k]==v}">${l}</button>`).join("");
const rt=(n,txt)=>n==null?`<span class="dim">${esc(txt||"n.m.")}</span>`:`${esc(txt||GR[n])}<span class="dim">(${n})</span>`;
const trans=e=>`${e.rf?rt(e.fn,e.rf):'<span class="dim">—</span>'} <span class="a">→</span> ${rt(e.tn,e.rt)}`;
const catTag=e=>`<span class="tag ${CAT[e.c][2]}">${CAT[e.c][0]}</span>`;
const f2=x=>x==null||isNaN(x)?"—":(x>0?"+":"")+x.toFixed(2);
const pct=x=>x==null?"—":(x>0?"+":"")+Math.round(x*100)+"%";
const lag=e=>{const l=daysBetween(e.d,e.fs);return e.bf?'<span class="dim">carico</span>':l<=1?`<span class="up">${l}g</span>`:`<span class="w">${l}g</span>`};
const panOk=t=>opts.pan==="ALL"||panel(t)===opts.pan;

/* ---------- MOV: movimenti rilevanti ---------- */
function MOV(){
  const cut=bdBack(ASOF,opts.win),wl=new Set(LS.get("asnp.wl",[]));
  let ev=EV.filter(e=>e.d>=cut&&panOk(e.t));
  const cnt=k=>ev.filter(e=>k.includes(e.c)).length;
  const nUp=ev.filter(e=>dir(e)>0).length,nDn=ev.filter(e=>dir(e)<0).length;
  const clu={};ev.forEach(e=>{const d=dir(e);if(!d)return;const k=e.t+"|"+d;(clu[k]=clu[k]||{t:e.t,d,b:new Set()}).b.add(e.b)});
  const clusters=Object.values(clu).filter(c=>c.b.size>=2).sort((a,b)=>b.b.size-a.b.size);
  const inClu=new Set(clusters.map(c=>c.t+"|"+c.d));
  const shown=ev.filter(e=>opts.main||CAT[e.c][1]<5).map(e=>({...e,p:CAT[e.c][1]===3&&inClu.has(e.t+"|"+dir(e))?2:CAT[e.c][1]}))
    .sort((a,b)=>a.p-b.p||b.d.localeCompare(a.d)||a.t.localeCompare(b.t));
  const row=e=>`<tr class="go" data-go="${e.t} ANR"><td class="idx">${R(e.t+" ANR")})</td><td>${catTag(e)}</td><td>${e.d}</td><td class="t">${e.t}</td><td class="dim">${panel(e.t)}</td><td>${esc(e.b)}</td><td>${trans(e)}</td><td class="n">${lag(e)}</td></tr>`;
  const head=`<tr><th></th><th>Tipo</th><th>Data</th><th>Ticker</th><th>Mkt</th><th>Broker</th><th>Rating da → a</th><th class="n" title="Giorni tra evento e primo snapshot che lo vede">Visto</th></tr>`;
  const wlRows=shown.filter(e=>wl.has(e.t)),rest=shown.filter(e=>!wl.has(e.t));
  return `<div class="bar"><span>MOV · Movimenti rilevanti</span><small>dal ${cut} al ${ASOF}</small></div>
  <div class="ctrl">Finestra ${optBtns("win",[[1,"1G"],[5,"5G"],[20,"20G"],[60,"60G"]])} Mercato ${optBtns("pan",[["ALL","Tutti"],["US","US"],["UK","UK"]])} Conferme/reiterazioni ${optBtns("main",[[0,"Nascoste"],[1,"Visibili"]])}</div>
  <div class="hdr"><span><span class="big up">${nUp}</span> upgrade</span><span><span class="big dn">${nDn}</span> downgrade</span><span><span class="big a">${cnt(["INIT"])}</span> inizi copertura</span><span><span class="big dim">${cnt(["MAIN","REIT","OTHER"])}</span> conferme</span><span><span class="big">${new Set(ev.map(e=>e.t)).size}</span> titoli toccati</span></div>
  <div class="sub">Ordine: doppi salti, poi attraversamenti di soglia buy/hold e hold/sell, poi titoli con più broker nella stessa direzione, poi il resto. Giorni lavorativi, date senza orario.</div>
  ${wl.size?`<div class="bar"><span>Watchlist</span><small>${wlRows.length} eventi</small></div><div class="scroll"><table>${head}${wlRows.map(row).join("")||'<tr><td colspan="8" class="dim">Nessun movimento sui titoli in watchlist in questa finestra.</td></tr>'}</table></div>`:""}
  ${clusters.length?`<div class="bar"><span>Più broker nella stessa direzione</span><small>${clusters.length} titoli</small></div><div class="scroll"><table><tr><th></th><th>Ticker</th><th>Mkt</th><th>Direzione</th><th class="n">Broker</th><th>Chi</th></tr>${clusters.map(c=>`<tr class="go" data-go="${c.t} ANR"><td class="idx">${R(c.t+" ANR")})</td><td class="t">${c.t}</td><td class="dim">${panel(c.t)}</td><td class="${c.d>0?"up":"dn"}">${c.d>0?"▲ upgrade":"▼ downgrade"}</td><td class="n">${c.b.size}</td><td>${esc([...c.b].join(", "))}</td></tr>`).join("")}</table></div>`:""}
  <div class="bar"><span>${wl.size?"Resto dell'universo":"Tutti gli eventi"}</span><small>${rest.length} eventi</small></div>
  <div class="scroll"><table>${head}${rest.map(row).join("")||'<tr><td colspan="8" class="dim">Nessun evento in questa finestra. Allarga a 5G o mostra le conferme.</td></tr>'}</table></div>`;
}

/* ---------- REV: rotazione revisioni ---------- */
function revIndex(){const by={};D.revisions.forEach(([t,a,fy,u,d,n])=>{if(fy!==opts.fy)return;(by[t]=by[t]||[]).push({a,u,d,n})});return by}
function breadth(r){const base=r.n??((r.u||0)+(r.d||0));return base>0?((r.u||0)-(r.d||0))/base:null}
function REV(){
  const by=revIndex(),snaps=[...new Set(D.revisions.map(r=>r[1]))].sort(),hasPrev=snaps.length>1;
  const rows=Object.entries(by).filter(([t])=>panOk(t)).map(([t,l])=>{l.sort((a,b)=>a.a.localeCompare(b.a));const c=l.at(-1),p=l.at(-2);
    const b=breadth(c),bp=p?breadth(p):null;return{t,u:c.u||0,d:c.d||0,n:(c.u||0)+(c.d||0),b,db:b!=null&&bp!=null?b-bp:null,ex:c.n}})
    .filter(r=>r.n>=opts.minr&&r.b!=null);
  const tbl=(list)=>`<div class="scroll"><table><tr><th></th><th>Ticker</th><th>Mkt</th><th class="n">▲ 30g</th><th class="n">▼ 30g</th><th class="n">Netto</th><th class="n">Breadth</th><th class="n">Δ vs prec.</th></tr>${list.map(r=>`<tr class="go" data-go="${r.t} ANR"><td class="idx">${R(r.t+" ANR")})</td><td class="t">${r.t}</td><td class="dim">${panel(r.t)}</td><td class="n up">${r.u}</td><td class="n dn">${r.d}</td><td class="n">${r.u-r.d>0?"+":""}${r.u-r.d}</td><td class="n ${r.b>0?"up":r.b<0?"dn":""}">${pct(r.b)}</td><td class="n ${r.db>0?"up":r.db<0?"dn":"dim"}">${r.db==null?"—":pct(r.db)}</td></tr>`).join("")}</table></div>`;
  let body;
  if(hasPrev){const m=rows.filter(r=>r.db!=null);
    body=`<div class="grid"><div><div class="bar"><span>Breadth in salita</span><small>vs ${snaps.at(-2)}</small></div>${tbl(m.filter(r=>r.db>0).sort((a,b)=>b.db-a.db).slice(0,30))}</div>
          <div><div class="bar"><span>Breadth in discesa</span><small>vs ${snaps.at(-2)}</small></div>${tbl(m.filter(r=>r.db<0).sort((a,b)=>a.db-b.db).slice(0,30))}</div></div>`;}
  else body=`<div class="note">Un solo snapshot di revisioni nel database (${snaps[0]||"nessuno"}). La rotazione è un confronto tra due notti: compare dal prossimo run. Intanto qui sotto ci sono i livelli, non le variazioni.</div>
    <div class="grid"><div><div class="bar"><span>Breadth più positiva</span><small>livello</small></div>${tbl([...rows].sort((a,b)=>b.b-a.b||b.n-a.n).slice(0,30))}</div>
    <div><div class="bar"><span>Breadth più negativa</span><small>livello</small></div>${tbl([...rows].sort((a,b)=>a.b-b.b||b.n-a.n).slice(0,30))}</div></div>`;
  const base=D.revisions.some(r=>r[5]!=null)?"numero di stime":"numero di revisioni (n_est non ancora raccolto)";
  return `<div class="bar"><span>REV · Rotazione delle revisioni EPS</span><small>${snaps.length} snapshot · ultimo ${snaps.at(-1)||"—"}</small></div>
  <div class="ctrl">Esercizio ${optBtns("fy",[[1,"FY corrente"],[2,"FY successivo"]])} Mercato ${optBtns("pan",[["ALL","Tutti"],["US","US"],["UK","UK"]])} Minimo revisioni ${optBtns("minr",[[1,"1"],[3,"3"],[5,"5"],[10,"10"]])}</div>
  <div class="sub">Breadth = (revisioni al rialzo − al ribasso) / ${base}, ultimi 30 giorni. ${rows.length} titoli sopra il filtro.</div>${body}`;
}

/* ---------- ANR: pagina titolo ---------- */
function consensusAt(ev,iso){const from=new Date(iso);from.setUTCDate(from.getUTCDate()-365);const f=from.toISOString().slice(0,10);
  const last={};ev.forEach(e=>{if(e.tn==null||e.d>iso||e.d<f)return;if(!last[e.b]||e.d>last[e.b].d)last[e.b]=e});
  const v=Object.values(last);return v.length?{m:v.reduce((s,e)=>s+e.tn,0)/v.length,n:v.length,cur:v}:null}
function chart(ev){
  if(!ev.length)return"";const pts=[];const end=new Date(ASOF+"T00:00:00Z");
  for(let i=24;i>=0;i--){const d=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth()-i+1,0));const iso=i===0?ASOF:d.toISOString().slice(0,10);const c=consensusAt(ev,iso);pts.push({iso,c})}
  while(pts.length>6&&!pts[0].c)pts.shift();
  const W=720,H=150,L=44,T=10,B=22,ok=pts.filter(p=>p.c);if(ok.length<2)return"";const SH={1:"S.Buy",2:"Buy",3:"Hold",4:"Under",5:"Sell"};
  const x=i=>L+i*(W-L-8)/(pts.length-1),y=v=>T+(v-1)*(H-T-B)/4;
  let dpath="",dots="";pts.forEach((p,i)=>{if(!p.c)return;dpath+=(dpath?"L":"M")+x(i).toFixed(1)+","+y(p.c.m).toFixed(1);});
  const grid=[1,2,3,4,5].map(v=>`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#1e1e1e"/><text x="4" y="${y(v)+4}">${SH[v]}</text>`).join("");
  const lbl=pts.map((p,i)=>i%Math.max(1,Math.ceil(pts.length/6))===0||i===pts.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="${i===pts.length-1?"end":"middle"}">${p.iso.slice(2,7)}</text>`:"").join("");
  const bars=pts.map((p,i)=>p.c?`<rect x="${x(i)-3}" y="${H-B-2-Math.min(p.c.n,30)*1.2}" width="6" height="${Math.min(p.c.n,30)*1.2}" fill="#3a2a05"/>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Rating medio di consenso negli ultimi 24 mesi">${grid}${bars}<path d="${dpath}" fill="none" stroke="var(--amber)" stroke-width="1.6"/>${lbl}</svg>`;
}
function ANR(t){
  const ev=(BY[t]||[]).slice().sort((a,b)=>b.d.localeCompare(a.d)),[pn,tier]=D.universe[t]||["?","?"];
  const c=consensusAt(ev,ASOF),wl=new Set(LS.get("asnp.wl",[]));
  const rv={};D.revisions.forEach(([tt,a,fy,u,d,n])=>{if(tt===t&&(!rv[fy]||a>rv[fy].a))rv[fy]={a,u,d,n}});
  const nb=c?c.cur.filter(e=>e.tn<=2).length:0,nh=c?c.cur.filter(e=>e.tn===3).length:0,ns=c?c.cur.filter(e=>e.tn>=4).length:0;
  const blocks=(n,cls)=>`<span class="${cls} dist">${"█".repeat(n)}</span>`;
  const cur=c?c.cur.slice().sort((a,b)=>a.tn-b.tn||b.d.localeCompare(a.d)):[];
  const prevOf=e=>ev.find(x=>x.b===e.b&&x.d<e.d&&x.tn!=null);
  return `<div class="bar"><span>${t} ${pn==="UK"?"LN":"US"} Equity · ANR</span><small>${pn} ${tier} · ${ev.length} eventi nel database</small></div>
  <div class="hdr"><span class="big t">${t}</span>
    <span>Consenso <span class="big ${c&&c.m<=2.5?"up":c&&c.m>=3.5?"dn":"a"}">${c?c.m.toFixed(2):"—"}</span> <span class="dim">(1 Strong Buy · 5 Sell)</span></span>
    <span>${c?c.n:0} broker attivi 12m</span>
    <button class="opt" style="border:1px solid var(--amber-dim);background:none;cursor:pointer;color:var(--amber)" data-go="${t} ${wl.has(t)?"WL-":"WL+"}">${wl.has(t)?"Togli dalla watchlist":"Aggiungi alla watchlist"}</button></div>
  ${ev.length?"":`<div class="note">Nessun rating per ${t} nella fonte. yfinance copre poco i titoli UK: su questo mercato restano utili le revisioni.</div>`}
  <div class="grid"><div>
    <div class="bar"><span>Distribuzione</span><small>ultimi 12 mesi</small></div>
    <dl class="kv"><dt>Buy</dt><dd>${blocks(nb,"up")} ${nb}</dd><dt>Hold</dt><dd>${blocks(nh,"a")} ${nh}</dd><dt>Sell</dt><dd>${blocks(ns,"dn")} ${ns}</dd></dl>
    <div class="bar"><span>Revisioni EPS 30g</span><small>${rv[1]?.a||"—"}</small></div>
    <table><tr><th>Esercizio</th><th class="n">▲</th><th class="n">▼</th><th class="n">Breadth</th></tr>
    ${[1,2].map(fy=>rv[fy]?`<tr><td>${fy===1?"FY corrente":"FY successivo"}</td><td class="n up">${rv[fy].u??"—"}</td><td class="n dn">${rv[fy].d??"—"}</td><td class="n">${pct(breadth(rv[fy]))}</td></tr>`:`<tr><td>${fy===1?"FY corrente":"FY successivo"}</td><td colspan="3" class="dim">nessun dato</td></tr>`).join("")}</table>
  </div><div>
    <div class="bar"><span>Consenso nel tempo</span><small>fine mese · barre = n. broker</small></div>${chart(ev)||'<div class="sub">Storico insufficiente per il grafico.</div>'}
    <div class="sub">Il primo carico contiene al massimo gli ultimi 40 eventi per titolo: la parte vecchia della curva può sottostimare i broker.</div>
  </div></div>
  <div class="bar"><span>Rating correnti per broker</span><small>${cur.length}</small></div>
  <div class="scroll"><table><tr><th></th><th>Broker</th><th>Rating</th><th>Data</th><th>Precedente</th><th>Azione</th></tr>
  ${cur.map(e=>{const p=prevOf(e);return`<tr class="go" data-go="BRK ${esc(e.b)}"><td class="idx">${R("BRK "+e.b)})</td><td>${esc(e.b)}</td><td class="${e.tn<=2?"up":e.tn>=4?"dn":"a"}">${esc(e.rt)} <span class="dim">(${e.tn})</span></td><td>${e.d}</td><td class="dim">${p?esc(p.rt)+" · "+p.d:"—"}</td><td>${catTag(e)}</td></tr>`}).join("")||'<tr><td colspan="6" class="dim">Nessun broker attivo negli ultimi 12 mesi.</td></tr>'}</table></div>
  <div class="bar"><span>Storico eventi</span><small>${ev.length}</small></div>
  <div class="scroll"><table><tr><th>Data</th><th>Tipo</th><th>Broker</th><th>Rating da → a</th><th>Primo snapshot</th></tr>
  ${ev.map(e=>`<tr><td>${e.d}</td><td>${catTag(e)}</td><td>${esc(e.b)}</td><td>${trans(e)}</td><td class="dim">${e.fs}${e.bf?" (carico iniziale)":""}</td></tr>`).join("")}</table></div>`;
}

/* ---------- BRK ---------- */
function BRK(arg){
  const cut=(()=>{const d=new Date(ASOF);d.setUTCDate(d.getUTCDate()-opts.bwin);return d.toISOString().slice(0,10)})();
  const ev=EV.filter(e=>e.d>=cut&&panOk(e.t));
  if(arg){const q=arg.toLowerCase();const name=D.brokers.find(b=>b.toLowerCase()===q)||D.brokers.find(b=>b.toLowerCase().includes(q));
    if(!name)return`<div class="bar">BRK</div><div class="sub">Nessun broker contiene “${esc(arg)}”.</div>`;
    const l=EV.filter(e=>e.b===name&&e.d>=cut&&panOk(e.t)&&(opts.main||CAT[e.c][1]<5));
    return `<div class="bar"><span>BRK · ${esc(name)}</span><small>dal ${cut}</small></div>
    <div class="ctrl">Finestra ${optBtns("bwin",[[30,"30G"],[90,"90G"],[365,"1A"]])} Conferme ${optBtns("main",[[0,"Nascoste"],[1,"Visibili"]])}</div>
    <div class="scroll"><table><tr><th></th><th>Data</th><th>Tipo</th><th>Ticker</th><th>Rating da → a</th></tr>${l.map(e=>`<tr class="go" data-go="${e.t} ANR"><td class="idx">${R(e.t+" ANR")})</td><td>${e.d}</td><td>${catTag(e)}</td><td class="t">${e.t}</td><td>${trans(e)}</td></tr>`).join("")||'<tr><td colspan="5" class="dim">Nessuna azione in finestra.</td></tr>'}</table></div>`;}
  const s={};ev.forEach(e=>{const r=s[e.b]=s[e.b]||{b:e.b,n:0,u:0,d:0,i:0,sum:0,k:0};r.n++;const d=dir(e);if(d>0)r.u++;if(d<0)r.d++;if(e.c==="INIT")r.i++;if(e.tn!=null){r.sum+=e.tn;r.k++}});
  const l=Object.values(s).sort((a,b)=>b.n-a.n);
  return `<div class="bar"><span>BRK · Attività dei broker</span><small>dal ${cut} · ${l.length} broker</small></div>
  <div class="ctrl">Finestra ${optBtns("bwin",[[30,"30G"],[90,"90G"],[365,"1A"]])} Mercato ${optBtns("pan",[["ALL","Tutti"],["US","US"],["UK","UK"]])}</div>
  <div class="scroll"><table><tr><th></th><th>Broker</th><th class="n">Eventi</th><th class="n">▲</th><th class="n">▼</th><th class="n">Init</th><th class="n">Rating medio</th></tr>
  ${l.map(r=>`<tr class="go" data-go="BRK ${esc(r.b)}"><td class="idx">${R("BRK "+r.b)})</td><td>${esc(r.b)}</td><td class="n">${r.n}</td><td class="n up">${r.u}</td><td class="n dn">${r.d}</td><td class="n a">${r.i}</td><td class="n">${r.k?(r.sum/r.k).toFixed(2):"—"}</td></tr>`).join("")}</table></div>`;
}

/* ---------- WL ---------- */
function WL(){
  const wl=LS.get("asnp.wl",[]);
  const rows=wl.map(t=>{const ev=(BY[t]||[]);const c=consensusAt(ev,ASOF);const last=ev.filter(e=>CAT[e.c][1]<5).sort((a,b)=>b.d.localeCompare(a.d))[0];
    const r=D.revisions.filter(x=>x[0]===t&&x[2]===1).sort((a,b)=>b[1].localeCompare(a[1]))[0];return{t,c,last,b:r?breadth({u:r[3],d:r[4],n:r[5]}):null}});
  return `<div class="bar"><span>WL · Watchlist</span><small>${wl.length} titoli · salvata in questo browser</small></div>
  <div class="sub">Aggiungi con <span class="w">AAPL WL+</span>, togli con <span class="w">AAPL WL-</span>. Per farla leggere anche al brief mattutino, copia i ticker nella sezione Watchlist di analyst-brief-config.md.</div>
  ${wl.length?`<div class="scroll"><table><tr><th></th><th>Ticker</th><th>Mkt</th><th class="n">Consenso</th><th class="n">Broker</th><th>Ultimo movimento</th><th class="n">Breadth FY1</th></tr>
  ${rows.map(r=>`<tr class="go" data-go="${r.t} ANR"><td class="idx">${R(r.t+" ANR")})</td><td class="t">${r.t}</td><td class="dim">${panel(r.t)}</td><td class="n">${r.c?r.c.m.toFixed(2):"—"}</td><td class="n">${r.c?r.c.n:0}</td><td>${r.last?`${r.last.d} ${catTag(r.last)} ${esc(r.last.b)}`:'<span class="dim">—</span>'}</td><td class="n">${pct(r.b)}</td></tr>`).join("")}</table></div>`:'<div class="note">Watchlist vuota. Scrivi un ticker seguito da WL+ nella riga di comando.</div>'}`;
}

/* ---------- HLTH ---------- */
function HLTH(){
  const s=D.snapshots,last=s.at(-1)||[];const cov={};Object.entries(D.universe).forEach(([t,[p]])=>{const c=cov[p]=cov[p]||{u:0,r:0,v:0};c.u++;if(BY[t])c.r++});
  const rvT=new Set(D.revisions.map(r=>r[0]));Object.entries(D.universe).forEach(([t,[p]])=>{if(rvT.has(t))cov[p].v++});
  const um=(last[5]||"").split(";").map(x=>x.trim()).filter(Boolean);
  return `<div class="bar"><span>HLTH · Salute della pipeline</span><small>ultimo run ${last[0]||"—"}</small></div>
  <dl class="kv"><dt>Esito</dt><dd>${last.length?(last[2]?`<span class="w">${last[2]} ticker falliti su ${last[1]}</span>`:`<span class="up">ok, ${last[1]} ticker, nessun fallimento</span>`):'<span class="dn">nessun run registrato</span>'}</dd>
  <dt>Righe</dt><dd>${last[3]??"—"} rating · ${last[4]??"—"} revisioni</dd>
  <dt>Grade non mappate</dt><dd>${um.length?um.map(x=>`<span class="w">${esc(x)}</span>`).join(", ")+' <span class="dim">(ricalcolate nel database se la mappa attuale le riconosce)</span>':'<span class="up">nessuna</span>'}</dd>
  <dt>Database costruito</dt><dd>${esc(D.meta.built_at)}</dd><dt>Fonte</dt><dd>github.com/${esc(D.meta.repo)}</dd></dl>
  <div class="bar"><span>Copertura per mercato</span><small>titoli con almeno un dato</small></div>
  <div class="scroll"><table><tr><th>Mercato</th><th class="n">Universo</th><th class="n">Con rating</th><th class="n">%</th><th class="n">Con revisioni</th><th class="n">%</th></tr>
  ${Object.entries(cov).map(([p,c])=>`<tr><td>${p}</td><td class="n">${c.u}</td><td class="n">${c.r}</td><td class="n ${c.r/c.u<.5?"w":""}">${Math.round(c.r/c.u*100)}%</td><td class="n">${c.v}</td><td class="n">${Math.round(c.v/c.u*100)}%</td></tr>`).join("")}</table></div>
  ${cov.UK&&cov.UK.r/cov.UK.u<.5?`<div class="note">yfinance restituisce rating solo per ${cov.UK.r} titoli UK su ${cov.UK.u}. Sul mercato UK il terminale è affidabile per le revisioni, molto meno per i cambi di rating.</div>`:""}
  <div class="bar"><span>Storico dei run</span><small>${s.length}</small></div>
  <div class="scroll"><table><tr><th>Data</th><th class="n">Ticker</th><th class="n">Falliti</th><th class="n">Righe rating</th><th class="n">Righe revisioni</th><th>Grade non mappate</th></tr>
  ${s.slice().reverse().map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]??"—"}</td><td class="n ${r[2]?"w":""}">${r[2]??"—"}</td><td class="n">${r[3]??"—"}</td><td class="n">${r[4]??"—"}</td><td class="dim">${esc(r[5]||"")}</td></tr>`).join("")}</table></div>`;
}

/* ---------- DB ---------- */
function DB(){
  const T=D.tables,byFS={};EV.forEach(e=>{byFS[e.fs]=(byFS[e.fs]||0)+1});
  const pit=EV.filter(e=>!e.bf),lags=pit.map(e=>daysBetween(e.d,e.fs)).sort((a,b)=>a-b);
  const range=EV.length?[EV.at(-1).d,EV[0].d]:["—","—"];
  return `<div class="bar"><span>DB · Database storico</span><small>SQLite · build/analyst.db</small></div>
  <div class="sub">I CSV notturni in data/ sono la fonte di verità e non vengono mai riscritti. Il database si ricostruisce da zero da tutti i CSV a ogni run: deduplica gli eventi che ricompaiono ogni notte e registra la prima notte in cui ciascuno è stato visto.</div>
  <div class="grid"><div>
  <div class="bar"><span>Tabelle</span><small>righe</small></div>
  <table><tr><th>Tabella</th><th class="n">Righe</th><th>Contenuto</th></tr>
  <tr><td class="a">rating_event</td><td class="n">${T.rating_event}</td><td class="dim">un evento unico per (titolo, data, broker, azione, da, a)</td></tr>
  <tr><td class="a">revision</td><td class="n">${T.revision}</td><td class="dim">conteggi revisioni per titolo, notte, esercizio</td></tr>
  <tr><td class="a">snapshot</td><td class="n">${T.snapshot}</td><td class="dim">esito di ogni run notturno</td></tr>
  <tr><td class="a">universe</td><td class="n">${T.universe}</td><td class="dim">ticker, mercato, fascia</td></tr>
  <tr><td class="a">ingest_log</td><td class="n">${T.ingest_log}</td><td class="dim">file letti e righe nuove per file</td></tr></table>
  <div class="bar"><span>Viste</span></div>
  <table><tr><td class="a">v_broker_current</td><td class="dim">ultimo rating di ogni broker su ogni titolo</td></tr>
  <tr><td class="a">v_consensus</td><td class="dim">media e distribuzione dei rating attivi 12 mesi</td></tr>
  <tr><td class="a">v_revision_breadth</td><td class="dim">breadth e variazione rispetto alla notte prima</td></tr>
  <tr><td class="a">v_moves</td><td class="dim">eventi classificati per rilevanza</td></tr></table>
  </div><div>
  <div class="bar"><span>Storico accumulato</span><small>eventi per notte di prima osservazione</small></div>
  <table><tr><th>Snapshot</th><th class="n">Eventi nuovi</th><th>Nota</th></tr>${Object.entries(byFS).sort().reverse().map(([d,n])=>`<tr><td>${d}</td><td class="n">${n}</td><td class="dim">${d===Object.keys(byFS).sort()[0]?"carico iniziale, non point-in-time":"point-in-time"}</td></tr>`).join("")}</table>
  <dl class="kv"><dt>Date eventi</dt><dd>${range[0]} → ${range[1]}</dd><dt>Broker distinti</dt><dd>${D.brokers.length}</dd>
  <dt>Point-in-time</dt><dd>${pit.length} eventi${lags.length?` · ritardo mediano ${lags[lags.length>>1]}g tra evento e osservazione`:" · si accumulano dal secondo run"}</dd></dl>
  </div></div>`;
}

/* ---------- HELP ---------- */
function HELP(){
  const c=[["MOV","Movimenti rilevanti su rating: doppi salti, soglie, gruppi di broker"],["REV","Rotazione delle revisioni EPS tra una notte e la precedente"],["AAPL ANR","Pagina titolo: consenso, broker, storico. Basta anche solo AAPL"],["VOD LN","Titolo UK (equivale a VOD.L)"],["BRK","Attività dei broker · BRK GOLDMAN per un broker"],["AAPL WL+","Aggiunge alla watchlist · WL- toglie · WL la mostra"],["HLTH","Esito dei run e copertura dei dati"],["DB","Struttura e storico del database"],["3","Numero + Invio: apre la riga 3 della schermata"],["Esc","Schermata precedente"]];
  return `<div class="bar"><span>HELP · Comandi</span><small>F1–F8 aprono le funzioni</small></div>
  <table>${c.map(([k,d])=>`<tr><td class="w" style="width:1%;padding-right:24px">${k} &lt;GO&gt;</td><td>${d}</td></tr>`).join("")}</table>
  <div class="note">Fonte yfinance: date senza orario, nessun titolo delistato, copertura rating UK scarsa. Il terminale è una rassegna. Non ordina titoli da comprare e non va usato per dimensionare posizioni.</div>`;
}
load();
})();
</script>
