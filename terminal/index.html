<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASNP · Analyst Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --card2:#f9fafb; --line:#e5e7eb; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --acc:#0f766e; --acc-soft:#e6f4f2; --acc-ink:#ffffff; --up:#15803d; --up-soft:#e8f5ec; --dn:#b91c1c; --dn-soft:#fdecec;
  --warn:#b45309; --warn-soft:#fef3e2; --info:#1d4ed8; --info-soft:#e8effd; --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  --r:14px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --card:#121821; --card2:#0f141b; --line:#222c38; --ink:#e7edf4; --ink2:#c3cdd9; --muted:#8593a3;
  --acc:#2dd4bf; --acc-soft:#0f2b2a; --acc-ink:#04201d; --up:#4ade80; --up-soft:#12281b; --dn:#f87171; --dn-soft:#2d1515;
  --warn:#fbbf24; --warn-soft:#2b220f; --info:#93b4ff; --info-soft:#141f38; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f14; --card:#121821; --card2:#0f141b; --line:#222c38; --ink:#e7edf4; --ink2:#c3cdd9; --muted:#8593a3;
  --acc:#2dd4bf; --acc-soft:#0f2b2a; --acc-ink:#04201d; --up:#4ade80; --up-soft:#12281b; --dn:#f87171; --dn-soft:#2d1515;
  --warn:#fbbf24; --warn-soft:#2b220f; --info:#93b4ff; --info-soft:#141f38; --shadow:none; color-scheme:dark; }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500}
nav a svg{width:18px;height:18px;flex:none;opacity:.8}
nav a:hover{background:var(--card2)}
nav a[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}
nav a[aria-current="page"] svg{opacity:1}
.aside-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
#status{display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.main{min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  padding:14px 28px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.search{position:relative;flex:1;max-width:620px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--acc)}
.search > svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px Inter;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.14);overflow:hidden;display:none}
#results .r{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
#results .r.on,#results .r:hover{background:var(--card2)}
#results .r .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .r .sub{color:var(--muted);font-size:12px}
#results .empty{padding:14px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

.page{padding:24px 28px 80px;max-width:1440px;width:100%}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.lbl{font-size:12px;color:var(--muted);margin-right:-8px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card > .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.card > .hd h2{font-size:15px;margin:0;letter-spacing:-.01em}
.card > .hd small{color:var(--muted)}
.card > .bd{padding:0 18px 16px}
.kpi{padding:16px 18px}
.kpi .k{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--muted)} .warnc{color:var(--warn)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--card)}
th.num,td.num{text-align:right}
th[aria-sort]::after{content:" ↓";color:var(--acc)} th[aria-sort="ascending"]::after{content:" ↑"}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--card2)}
.tk{display:flex;flex-direction:column;line-height:1.25}
.tk b{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tk span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-up{background:var(--up-soft);color:var(--up)} .p-dn{background:var(--dn-soft);color:var(--dn)}
.p-in{background:var(--info-soft);color:var(--info)} .p-nt{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.p-wr{background:var(--warn-soft);color:var(--warn)}
.mkt{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.rt{color:var(--muted)} .rt b{color:var(--ink);font-weight:600}
table.mini td{white-space:normal}
table.mini td.num{white-space:nowrap}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer;color:var(--ink2)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13px}
.empty-state{padding:30px 18px;text-align:center;color:var(--muted)}

/* scheda titolo */
.co-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.co-head h1{font-size:28px}
.co-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.co-meta code{font:12.5px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.px{text-align:right}
.px .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:6px 18px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.range{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--dn-soft),var(--card2),var(--up-soft));border:1px solid var(--line);margin:22px 4px 26px}
.range .m{position:absolute;top:-6px;width:3px;height:18px;border-radius:2px;transform:translateX(-50%)}
.rleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:-18px 0 8px}
.rleg i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--card2);margin:8px 0}
.dist div{height:100%}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.stat:last-child{border-bottom:0}
.stat span:first-child{color:var(--muted)}

.bar-s{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-s i{display:block;height:8px;border-radius:99px;background:var(--acc)}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.rk.g1{background:#f5c542;color:#3b2a00;border-color:transparent}.rk.g2{background:#cfd6de;color:#1d2733;border-color:transparent}.rk.g3{background:#d99a62;color:#2e1603;border-color:transparent}
.method{font-size:13.5px;color:var(--ink2)} .method li{margin:4px 0}
/* forecast */
:root{--px:#3b8bea;--tgt:#f5a623;--hold:#b8bec6}
:root[data-theme="dark"]{--px:#5aa2f0;--tgt:#f7b84b;--hold:#5b6573}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--px:#5aa2f0;--tgt:#f7b84b;--hold:#5b6573}}
.fc-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:16px;align-items:start}
.kk{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.cons{padding:18px}
.cons .cpill.big{display:block;text-align:center;margin-bottom:10px}
.donut{width:100%;max-width:170px;display:block;margin:6px auto}
.donut .dn1{font-size:26px;font-weight:700;fill:var(--ink)} .donut .dn2{font-size:11px;fill:var(--muted)}
.cons .lg div{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:5px 0}
.cons .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cpill{display:inline-block;font-weight:700;font-size:13px;padding:4px 12px;border-radius:8px}
.cpill.big{font-size:15px;padding:7px 12px}
.c-sb,.c-b{background:var(--up-soft);color:var(--up)} .c-h{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.c-s,.c-ss{background:var(--dn-soft);color:var(--dn)} .c-na{background:var(--card2);color:var(--muted)}
.fc-main{padding:18px 18px 8px;position:relative}
.big-t{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.fc-wrap{position:relative}
.chart .fl{font-size:11px;fill:var(--muted);font-weight:600} .chart .fv{font-size:12px;fill:var(--ink);font-weight:700}
.tip{position:absolute;display:none;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px 10px;font-size:12.5px;min-width:150px;z-index:5}
.score{padding:0;overflow:hidden}
.sc-h{padding:12px 16px;font-weight:700;background:var(--card2);border-bottom:1px solid var(--line)}
.sc{padding:12px 16px;border-bottom:1px solid var(--line)} .score .btn{margin:12px 16px;width:calc(100% - 32px)!important}
.sc .row,.icard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:6px} .sc .row span,.icard .row span{color:var(--muted)}
.tech{display:flex;align-items:center;justify-content:space-between;gap:8px} .gauge{width:110px}
details summary{cursor:pointer;font-size:12px;margin-top:6px}
.cu{color:var(--muted);margin-left:2px;cursor:help}
.pos{font-weight:700} .pos.mut{color:var(--ink2)}
h2.sec{font-size:16px;margin:4px 0 12px}
.icards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:26px}
.icard{padding:14px 16px;display:block}
.icard:hover{border-color:var(--acc)}
.icard .iv{font-size:20px;font-weight:700;margin-bottom:4px} .icard .iv span{font-size:13px;font-weight:600}
@media (max-width:1200px){.fc-grid{grid-template-columns:230px minmax(0,1fr)}.score{grid-column:1/-1}}
@media (max-width:900px){.fc-grid{grid-template-columns:1fr}}
.bottomnav{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  header{padding:10px 16px}
  .page{padding:18px 16px 96px}
  .two{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto}
  .bottomnav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px}
  .bottomnav a svg{width:20px;height:20px}
  .bottomnav a[aria-current="page"]{color:var(--acc)}
  .search kbd{display:none}
  .hide-m{display:none}
  .px{text-align:left}
  .co-head{align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></div>
      <div><b>Analyst Snapshot</b><small>Rating · Target · EPS</small></div></div>
    <nav id="nav"></nav>
    <div class="aside-foot"><div id="status"></div><button class="btn" id="themeBtn" type="button">Tema chiaro/scuro</button></div>
  </aside>
  <div class="main">
    <header>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Cerca titolo (nome, ISIN, ticker) o investitore…" aria-label="Cerca titolo">
        <kbd>/</kbd>
        <div id="results" role="listbox"></div>
      </div>
      <div class="hdr-right"><span class="mut hide-m" id="asof"></span>
        <div style="position:relative"><button class="iconbtn" id="bell" type="button" aria-label="Novità"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
          <span id="bellN" style="display:none;position:absolute;top:-5px;right:-5px;background:var(--dn);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 5px;pointer-events:none"></span>
          <div id="feedP" style="display:none;position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18);z-index:50"></div></div></div>
    </header>
    <div class="page" id="page"><div class="empty-state">Caricamento dati…</div></div>
  </div>
</div>
<nav class="bottomnav" id="bnav"></nav>

<script>
"use strict";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
(function(){const t=LS.get("asnp.theme",null);if(t)document.documentElement.dataset.theme=t;})();
document.getElementById("themeBtn").onclick=()=>{
  const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const t=dark?"light":"dark";document.documentElement.dataset.theme=t;LS.set("asnp.theme",t);render();};

const IC={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 moves:'<path d="M7 17V7"/><path d="m4 10 3-3 3 3"/><path d="M17 7v10"/><path d="m14 14 3 3 3-3"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',
 rev:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/>',
 broker:'<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2"/>',
 star:'<path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5L12 16.7 7.1 19.2l.9-5.5-4-3.9 5.5-.8z"/>',
 trophy:'<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>',
 inst:'<path d="M3 21h18"/><path d="M4 10h16"/><path d="M12 3 3 8h18z"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const PAGES=[["home","Panoramica","home"],["moves","Movimenti","moves"],["targets","Target price","target"],
  ["revisions","Revisioni","rev"],["ranking","Classifica broker","trophy"],["investors","Investitori","inst"],["brokers","Broker","broker"],["watchlist","Watchlist","star"],["pipeline","Dati","db"]];
const MKTS=[["ALL","Tutti"],["US","USA"],["UK","UK"],["IT","Italia"],["DE","Germania"],["FR","Francia"],["EU50","Euro Stoxx 50"]];
const MKT_LBL={US:"USA",UK:"UK",IT:"IT",DE:"DE",FR:"FR",NL:"NL",ES:"ES",BE:"BE",FI:"FI",IE:"IE",PT:"PT"};
const IDX_LBL={SP500:"S&P 500",UKX:"FTSE 100",MCX:"FTSE 250",FTSEMIB:"FTSE MIB",DAX:"DAX 40",CAC:"CAC 40",SX5E:"Euro Stoxx 50"};
const WINS=[[1,"1G"],[5,"5G"],[20,"1M"],[60,"3M"],[250,"1A"]];
const RLBL={1:"Strong Buy",2:"Buy",3:"Hold",4:"Underperform",5:"Sell"};

let D=null, U={}, EV=[], BR=[], ASOF=null, IDX=[];
const st={mkt:LS.get("asnp.mkt","ALL"),win:LS.get("asnp.win",5),type:"REL",sort:{},limit:{}};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(v,d=2)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null||!isFinite(v)?"–":(v>0?"+":"")+nf(v,d)+"%";
const pcls=v=>v==null||!isFinite(v)?"mut":v>0?"up":v<0?"dn":"mut";
const fd=s=>{if(!s)return"–";const[y,m,d]=s.split("-");return `${d}/${m}/${y.slice(2)}`};
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const wl=()=>new Set(LS.get("asnp.wl",[]));
function bdBack(iso,n){const d=new Date(iso+"T12:00:00Z");let k=0;while(k<n){d.setUTCDate(d.getUTCDate()-1);const w=d.getUTCDay();if(w&&w<6)k++;}return d.toISOString().slice(0,10);}

function info(t){const u=U[t]||[];return{t,name:u[0]||u[6]||t,panel:u[1]||"",idx:(u[2]||"").split(";").filter(Boolean),isin:u[3]||"",cur:u[4]||"",lname:u[6]||"",exch:u[7]||"",us:u[8]||""};}
function inMkt(t){if(st.mkt==="ALL")return true;const i=info(t);return st.mkt==="EU50"?i.idx.includes("SX5E"):i.panel===st.mkt;}
function cat(e){const f=e.fn,t=e.tn;
  if(f!=null&&t!=null&&Math.abs(t-f)>=2)return t<f?"DBL_UP":"DBL_DN";
  if(f!=null&&t!=null){if(f<=2&&t>=3)return"BH_DN";if(f>=3&&t<=2)return"BH_UP";if(f<=3&&t>=4)return"HS_DN";if(f>=4&&t<=3)return"HS_UP";}
  if(e.a==="up")return"UP";if(e.a==="down")return"DN";if(e.a==="init")return"INIT";return"OTHER";}
const CAT={DBL_UP:["Doppio upgrade","p-up"],DBL_DN:["Doppio downgrade","p-dn"],BH_UP:["Upgrade a Buy","p-up"],BH_DN:["Downgrade da Buy","p-dn"],
  HS_UP:["Upgrade da Sell","p-up"],HS_DN:["Downgrade a Sell","p-dn"],UP:["Upgrade","p-up"],DN:["Downgrade","p-dn"],INIT:["Inizio copertura","p-in"],OTHER:["Conferma","p-nt"]};
const RANK={DBL_UP:0,DBL_DN:0,BH_UP:1,BH_DN:1,HS_UP:1,HS_DN:1,UP:2,DN:2,INIT:3,OTHER:4};
function ptChg(e){return e.pf&&e.pt?100*(e.pt/e.pf-1):null;}
function lastPx(t){return (D.last||{})[t]||null;}
function upNow(e){const l=lastPx(e.t);return e.pt&&l&&l[1]?100*(e.pt/l[1]-1):null;}
function upEv(e){return e.pt&&e.cx?100*(e.pt/e.cx-1):null;}

async function load(){
  let raw;
  try{const r=await fetch("terminal.json",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);raw=await r.json();}
  catch(err){document.getElementById("page").innerHTML=`<div class="card empty-state">Dati non disponibili (${esc(err.message)}). Il file terminal.json lo pubblica il workflow 3-terminale.</div>`;return;}
  D=raw;U=D.universe||{};BR=D.brokers||[];ASOF=D.meta.as_of;
  EV=D.events.map(r=>({t:r[0],d:r[1],b:BR[r[2]]||"—",a:r[3],rf:r[4],rt:r[5],fn:r[6],tn:r[7],fs:r[8],bf:r[9],pf:r[10],pt:r[11],pa:r[12],cx:r[13],cu:r[14]}));
  EV.forEach(e=>e.c=cat(e));
  IDX=Object.keys(U).map(t=>{const i=info(t);const base=t.split(".")[0];
    return{t,i,k:[norm(t),norm(base)],n:norm(i.name+" "+i.lname),isin:norm(i.isin)}});
  document.getElementById("asof").textContent=`Dati al ${fd(ASOF)} · aggiornato ${D.meta.built_at}`;
  const last=(D.snapshots||[]).slice(-1)[0];
  document.getElementById("status").innerHTML=`<span><span class="dot" style="background:${last&&!last[2]?"var(--up)":"var(--warn)"}"></span>Pipeline ${last&&!last[2]?"ok":"da controllare"}</span><span>Snapshot ${fd(ASOF)}</span>`;
  addEventListener("hashchange",render);render();loadFeed();loadInst();
}

/* ---------- ricerca ---------- */
const qi=document.getElementById("q"),res=document.getElementById("results");let hits=[],hi=0;
function search(q){q=norm(q.trim());if(!q)return[];const out=[];
  for(const x of IDX){let s=0;
    if(x.k[0]===q||x.k[1]===q)s=100;else if(x.isin&&x.isin===q)s=95;else if(x.k[0].startsWith(q)||x.k[1].startsWith(q))s=70;
    else if(x.isin&&q.length>=4&&x.isin.startsWith(q))s=65;else if(x.n.startsWith(q))s=60;else if((" "+x.n).includes(" "+q))s=50;else if(x.n.includes(q))s=40;
    if(s)out.push([s,x]);}
  if(INST&&q.length>=3)for(const m of INST.managers){const n=norm(m.name);const s=n.startsWith(q)?55:(" "+n).includes(" "+q)?45:0;
    if(s)out.push([s,{mg:m,i:{name:m.name}}]);}
  return out.sort((a,b)=>b[0]-a[0]||a[1].i.name.localeCompare(b[1].i.name)).slice(0,10).map(a=>a[1]);}
function showRes(){if(!qi.value.trim()){res.style.display="none";return;}
  res.style.display="block";
  res.innerHTML=hits.length?hits.map((x,k)=>{if(x.mg)return `<div class="r${k===hi?" on":""}" data-inv="${esc(x.mg.cik)}" role="option"><span class="mkt">13F</span>
    <div style="min-width:0;flex:1"><div class="nm">${esc(x.mg.name)}</div><div class="sub">Investitore istituzionale${x.mg.rank?` · ${x.mg.rank}° in classifica`:""}</div></div><span class="mut">${usd(x.mg.aum)}</span></div>`;
    const l=lastPx(x.t);return `<div class="r${k===hi?" on":""}" data-t="${esc(x.t)}" role="option">
    <span class="mkt">${esc(MKT_LBL[x.i.panel]||x.i.panel)}</span>
    <div style="min-width:0;flex:1"><div class="nm">${esc(x.i.name)}</div><div class="sub">${esc(x.t)}${x.i.isin?" · "+esc(x.i.isin):""}</div></div>
    ${l?`<span class="mut">${nf(l[1])}</span>`:""}</div>`}).join(""):`<div class="empty">Nessun titolo trovato. Prova con il nome, l'ISIN (es. IT0003132476) o il ticker.</div>`;}
qi.addEventListener("input",()=>{hits=search(qi.value);hi=0;showRes();});
qi.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){hi=Math.min(hi+1,hits.length-1);showRes();e.preventDefault();}
  else if(e.key==="ArrowUp"){hi=Math.max(hi-1,0);showRes();e.preventDefault();}
  else if(e.key==="Enter"&&hits[hi]){go(hits[hi].mg?"inv/"+hits[hi].mg.cik:"t/"+hits[hi].t);}
  else if(e.key==="Escape"){qi.value="";showRes();qi.blur();}});
res.addEventListener("mousedown",e=>{const r=e.target.closest(".r");if(r){e.preventDefault();go(r.dataset.inv?"inv/"+r.dataset.inv:"t/"+r.dataset.t);}});
qi.addEventListener("blur",()=>setTimeout(()=>res.style.display="none",120));
qi.addEventListener("focus",()=>{if(qi.value.trim())showRes();});
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus();}});
function go(h){qi.value="";res.style.display="none";qi.blur();location.hash="#/"+h;}

function rating(e){const f=e.rf?`${esc(e.rf)} → `:"";return `<span class="rt">${f}<b>${esc(e.rt||"–")}</b></span>`;}
const cuMark=e=>e.cu?`<sup class="cu" title="Target riportato sulla quotazione USA ${esc(e.cu)} e convertito nella valuta locale">≈</sup>`:"";
function ptCell(e){if(!e.pt)return'<span class="mut">–</span>';const c=ptChg(e);
  return `${e.pf?`<span class="mut">${nf(e.pf)} → </span>`:""}<b>${nf(e.pt)}</b>${cuMark(e)}${c!=null?` <span class="${pcls(c)}" style="font-size:12px">${pct(c)}</span>`:""}`;}
/* tabella ordinabile: cols=[{k,l,v(row)->valore ordinamento,h(row)->html,num}] */
function table(id,cols,rows,{def,desc=true,limit=100,rowAttr}={}){
  const s=st.sort[id]||(st.sort[id]={k:def||cols[0].k,desc});
  const c=cols.find(c=>c.k===s.k)||cols[0];
  const r=[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return (x<y?-1:x>y?1:0)*(s.desc?-1:1);});
  const lim=st.limit[id]||limit;
  return `<div class="tw"><table><thead><tr>${cols.map(k=>`<th class="${k.num?"num":""}" data-sort="${id}" data-k="${k.k}"${k.k===s.k?` aria-sort="${s.desc?"descending":"ascending"}"`:""}>${k.l}</th>`).join("")}</tr></thead>
  <tbody>${r.slice(0,lim).map(x=>`<tr ${rowAttr?rowAttr(x):""}>${cols.map(k=>`<td class="${k.num?"num":""}">${k.h(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  ${r.length>lim?`<button class="more" data-more="${id}">Mostra altri (${r.length-lim})</button>`:""}
  ${r.length?"":`<div class="empty-state">Nessun dato con questi filtri.</div>`}`;}
const EVCOLS=[
  {k:"d",l:"Data",v:e=>e.d,h:e=>fd(e.d)},

  {k:"b",l:"Broker",v:e=>e.b,h:e=>esc(e.b)},
  {k:"pt",l:"Target",num:1,v:e=>ptChg(e)??(e.pt?0:null),h:ptCell},
  {k:"cx",l:"Chiusura giorno",num:1,v:e=>e.cx,h:e=>nf(e.cx)},
  {k:"ue",l:"Upside giorno",num:1,v:upEv,h:e=>`<span class="${pcls(upEv(e))}">${pct(upEv(e))}</span>`},
  {k:"un",l:"Upside oggi",num:1,v:upNow,h:e=>`<span class="${pcls(upNow(e))}">${pct(upNow(e))}</span>`}];

  </div>`;}

    {k:"hit_1m",l:"1M",num:1,v:r=>r.hit_1m,h:r=>r.hit_1m==null?'<span class="mut">–</span>':nf(r.hit_1m*100,0)+"%"},

  <div class="card" style="margin-top:16px"><div class="hd"><h2>Come è calcolata</h2></div><div class="bd method"><ul>
    <li><b>Ingresso</b>: chiusura del giorno dell'analisi, dopo la reazione del mercato. Si misura la capacità di prevedere, non l'effetto della notizia.</li>
    <li><b>Risultato</b>: rendimento del titolo meno quello del suo indice (S&amp;P 500, FTSE 100/250, FTSE MIB, DAX, CAC 40, Euro Stoxx 50) a 1, 3, 6 e 12 mesi.</li>
    <li><b>Successo</b>: Buy o upgrade con il titolo che batte l'indice, Sell o downgrade con il titolo che fa peggio. Gli Hold non contano.</li>
    <li><b>Alfa medio</b>: rendimento in eccesso ottenuto seguendo le indicazioni del broker (comprando i Buy, vendendo i Sell).</li>
    <li><b>IC target</b>: correlazione di rango fra l'upside implicito nel target e il rendimento realizzato. <b>Target raggiunti</b>: il prezzo ha toccato il target entro 12 mesi.</li>
    <li><b>Abilità ML</b>: regressione ridge con cross-validation temporale. Stima il contributo del broker al rendimento a 3 mesi al netto di momentum, volatilità, mercato e upside del target. Se i dati non distinguono i broker, la regolarizzazione porta tutti vicino a zero.</li>
    <li><b>Correzione per il campione</b>: i tassi di ogni broker sono avvicinati alla media generale in proporzione a quante analisi ha (${j.min_n} per entrare, peso della media pari a 50 analisi). Così pochi colpi fortunati non bastano per salire in classifica.</li>

    <li><b>Storico</b>: l'intera cronologia di analisi che Yahoo conserva, più 10 anni di prezzi, scaricati una volta. Ogni notte si aggiungono le analisi nuove e gli esiti che maturano. Le analisi storiche non sono point-in-time, e l'universo è quello attuale (distorsione da sopravvivenza).</li>
    <li>Fonte: Yahoo Finance. Il nome del singolo analista non è disponibile, quindi la classifica è per casa di ricerca.</li></ul></div></div>`;}
function btCard(j){const bt=j.backtest||{},P=bt.periods||[],cv=j.coverage||{};

function rankChart(h){if(!h||h.length<2)return"";const W=520,H=150,L=34,R=10,T=10,B=22;const mxN=Math.max(...h.map(x=>x[2]));
  const X=i=>L+(W-L-R)*i/(h.length-1),Y=r=>T+(H-T-B)*(r-1)/Math.max(1,mxN-1);
  const d=h.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Posizione storica">
   <line x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(1)+4}" text-anchor="end">1°</text>
   <line x1="${L}" x2="${W-R}" y1="${Y(mxN)}" y2="${Y(mxN)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(mxN)+4}" text-anchor="end">${mxN}°</text>
   <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/>
   ${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.5" fill="var(--acc)"><title>${fd(x[0])}: ${x[1]}° su ${x[2]}</title></circle>`).join("")}
   <text x="${L}" y="${H-5}">${fd(h[0][0])}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${fd(h.at(-1)[0])}</text></svg>`;}

function brokerCurrent(t){const m={};for(const e of EV){if(e.t!==t||e.tn==null)continue;const x=m[e.b];if(!x||e.d>x.d)m[e.b]=e;}

function donut(b,h,s,label){const n=b+h+s,R=62,r=46,C=2*Math.PI;let a0=-Math.PI/2;
  const seg=(v,col)=>{if(!v)return"";if(v===n)return `<circle cx="80" cy="80" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`;const a1=a0+C*v/n-(n>1&&v<n?.03:0);const big=a1-a0>Math.PI?1:0;
    const p=`M${80+R*Math.cos(a0)},${80+R*Math.sin(a0)}A${R},${R} 0 ${big} 1 ${80+R*Math.cos(a1)},${80+R*Math.sin(a1)}L${80+r*Math.cos(a1)},${80+r*Math.sin(a1)}A${r},${r} 0 ${big} 0 ${80+r*Math.cos(a0)},${80+r*Math.sin(a0)}Z`;

   ${n?seg(b,"var(--up)")+seg(h,"var(--hold)")+seg(s,"var(--dn)"):`<circle cx="80" cy="80" r="54" fill="none" stroke="var(--line)" stroke-width="16"/>`}
   <text x="80" y="80" text-anchor="middle" class="dn1">${n||"–"}</text><text x="80" y="98" text-anchor="middle" class="dn2">${label||"rating"}</text></svg>`;}
function consBox(b,h,s,mean,note,unit){return `<div class="card cons"><div class="kk">Consenso generale</div>${consPill(mean,1)}

  <div class="lg"><div><i style="background:var(--up)"></i><b>${b}</b> Buy</div><div><i style="background:var(--hold)"></i><b>${h}</b> Hold</div><div><i style="background:var(--dn)"></i><b>${s}</b> Sell</div></div>
  <div class="mut" style="font-size:12px;margin-top:10px">${note}</div></div>`;}

function sma(c,n,i){if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=c[k];return s/n;}
function ema(c,n){const k=2/(n+1);const o=[];c.forEach((v,i)=>o.push(i?v*k+o[i-1]*(1-k):v));return o;}
function technical(c){if(!c||c.length<60)return null;const i=c.length-1,p=c[i];let sc=0,n=0;const sig=[];
  const add=(name,v)=>{if(v==null)return;sc+=v;n++;sig.push([name,v]);};
  for(const k of [20,50,200]){const m=sma(c,k,i);if(m!=null)add(`Prezzo vs media ${k}g`,p>m?1:-1);}
  const m50=sma(c,50,i),m200=sma(c,200,i);if(m50&&m200)add("Media 50g vs 200g",m50>m200?1:-1);
  let g=0,l=0;for(let k=i-13;k<=i;k++){const d=c[k]-c[k-1];if(d>0)g+=d;else l-=d;}const rsi=l?100-100/(1+g/l):100;
  add(`RSI 14 (${nf(rsi,0)})`,rsi<30?1:rsi>70?-1:0);
  const e12=ema(c,12),e26=ema(c,26),mac=e12.map((v,k)=>v-e26[k]),sg=ema(mac,9);add("MACD vs segnale",mac[i]>sg[i]?1:-1);
  add("Momentum 1 mese",c[i]>c[i-21]?1:-1);add("Momentum 3 mesi",c.length>63?(c[i]>c[i-63]?1:-1):null);
  const x=sc/n;const lab=x>=.6?["Strong Buy","up"]:x>=.2?["Buy","up"]:x<=-.6?["Strong Sell","dn"]:x<=-.2?["Sell","dn"]:["Neutrale","mut"];
  return{x,lab,sig};}
function gauge(x){const a=Math.PI*(1-(x+1)/2);const cols=["#c0392b","#e07b53","#c9c9c9","#7fc6a4","#1f8a55"];
  return `<svg viewBox="0 0 120 70" class="gauge">${cols.map((c,k)=>{const a0=Math.PI*(1-k/5),a1=Math.PI*(1-(k+1)/5)+.03;
    return `<path d="M${60+50*Math.cos(a0)},${62-50*Math.sin(a0)}A50,50 0 0 1 ${60+50*Math.cos(a1)},${62-50*Math.sin(a1)}" stroke="${c}" stroke-width="9" fill="none"/>`}).join("")}
   <line x1="60" y1="62" x2="${60+38*Math.cos(a)}" y2="${62-38*Math.sin(a)}" stroke="var(--ink2)" stroke-width="2.5" stroke-linecap="round"/><circle cx="60" cy="62" r="4" fill="var(--ink2)"/></svg>`;}

/* grafico stile "forecast": 24 mesi di prezzo + target medio storico + ventaglio a 12 mesi */
const CH={};let chId=0;
function fcChart(d,c,apt,fan,opt={}){
  if(!d||d.length<2)return `<div class="empty-state">Storico prezzi non ancora disponibile.</div>`;
  const endD=d.at(-1),t1=Date.parse(endD),t0=t1-730*864e5,t2=t1+365*864e5;
  let k0=d.findIndex(x=>Date.parse(x)>=t0);if(k0<0)k0=0;const dd=d.slice(k0),cc=c.slice(k0);
  const ap=(apt||[]).filter(x=>Date.parse(x[0])>=t0);
  const vals=[...cc,...ap.map(x=>x[1])];if(fan)vals.push(fan.hi,fan.lo,fan.avg);
  let mn=Math.min(...vals.filter(isFinite)),mx=Math.max(...vals.filter(isFinite));const pad=(mx-mn)*.08||1;mn-=pad;mx+=pad;
  const pw=document.getElementById("page").clientWidth-(innerWidth>900?56:32);
  const W=Math.round(Math.max(320,Math.min(900,innerWidth>1200?pw-560:pw-2))),H=Math.round(Math.max(240,W*.5)),L=48,R=74,T=16,B=26;
  const X=ts=>L+(W-L-R)*(ts-t0)/(t2-t0),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const pl=cc.map((v,k)=>`${k?"L":"M"}${X(Date.parse(dd[k])).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const al=ap.map((x,k)=>`${k?"L":"M"}${X(Date.parse(x[0])).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("");
  const nt=5,yt=[...Array(nt)].map((_,k)=>mn+(mx-mn)*k/(nt-1));
  const xt=[];{const s=new Date(t0);s.setUTCDate(1);s.setUTCMonth(s.getUTCMonth()<6?6:12);while(s.getTime()<=t2){xt.push(s.getTime());s.setUTCMonth(s.getUTCMonth()+6);}}
  const MES=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  const x1=X(t1),xe=X(t2),y0=Y(cc.at(-1));const id="ch"+(++chId);
  CH[id]={X,Y,t0,t1,dd,cc,ap,L,W,R,T,H,B};
  const cl=cc.at(-1);
  const fanSvg=fan?`${fan.hi>cl?`<path d="M${x1},${y0}L${xe},${Y(fan.hi)}L${xe},${Y(Math.max(cl,fan.lo))}Z" fill="var(--up)" opacity=".10"/>`:""}
    ${fan.lo<cl?`<path d="M${x1},${y0}L${xe},${Y(Math.min(cl,fan.hi))}L${xe},${Y(fan.lo)}Z" fill="var(--dn)" opacity=".10"/>`:""}
    <line x1="${x1}" y1="${y0}" x2="${xe}" y2="${Y(fan.hi)}" stroke="var(--up)" stroke-width="2"/>
    <line x1="${x1}" y1="${y0}" x2="${xe}" y2="${Y(fan.avg)}" stroke="var(--up)" stroke-width="2" opacity=".75"/>
    <line x1="${x1}" y1="${y0}" x2="${xe}" y2="${Y(fan.lo)}" stroke="var(--dn)" stroke-width="2"/>
    ${(()=>{const L3=[["Max",fan.hi,"var(--up)"],["Medio",fan.avg,"var(--up)"],["Min",fan.lo,"var(--dn)"]].map(x=>[...x,Y(x[1])]);
      for(let k=1;k<3;k++)if(L3[k][3]-L3[k-1][3]<28)L3[k][3]=L3[k-1][3]+28;
      return L3.map(([n,v,col,ly])=>`<circle cx="${xe}" cy="${Y(v)}" r="4" fill="${col}"/><text x="${xe+8}" y="${ly-3}" class="fl">${n}</text><text x="${xe+8}" y="${ly+11}" class="fv">${nf(v)}</text>`).join("")})()}`:"";
  return `<div class="fc-wrap"><svg class="chart fc" viewBox="0 0 ${W} ${H}" data-ch="${id}" role="img" aria-label="Prezzo e target degli analisti">
   ${yt.map(v=>`<line x1="${L}" x2="${xe}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,v>=1000?0:2)}</text>`).join("")}
   ${xt.map(x=>{const dt=new Date(x);return `<line x1="${X(x)}" x2="${X(x)}" y1="${H-B}" y2="${H-B+4}" stroke="var(--line)"/><text x="${X(x)}" y="${H-6}" text-anchor="middle">${MES[dt.getUTCMonth()]} ${String(dt.getUTCFullYear()).slice(2)}</text>`}).join("")}
   <line x1="${x1}" x2="${x1}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="3 3"/>
   <text x="${L}" y="${T-4}" class="fl">Ultimi 24 mesi</text><text x="${xe}" y="${T-4}" class="fl" text-anchor="end">Previsione a 12 mesi</text>
   <path d="${pl}" fill="none" stroke="var(--px)" stroke-width="1.8" stroke-linejoin="round"/>
   ${fan?`<line x1="${x1}" x2="${xe}" y1="${y0}" y2="${y0}" stroke="var(--px)" stroke-width="1.8"/>`:""}
   ${al?`<path d="${al}" fill="none" stroke="var(--tgt)" stroke-width="2" stroke-linejoin="round"/>`:""}
   ${fanSvg}
   <g class="hover" style="display:none"><line y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 3"/><circle r="4" fill="var(--px)"/><circle r="4" fill="var(--tgt)"/></g>
   <rect x="${L}" y="${T}" width="${x1-L}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip" id="tip-${id}"></div>
   <div class="legend"><span><i style="background:var(--px)"></i>Prezzo di chiusura</span><span><i style="background:var(--tgt)"></i>${opt.tlabel||"Target medio degli analisti (storico)"}</span>${fan?`<span><i style="background:var(--up)"></i>Target max / medio</span><span><i style="background:var(--dn)"></i>Target min</span>`:""}</div></div>`;}
document.addEventListener("mousemove",e=>{const sv=e.target.closest&&e.target.closest("svg.fc");
  document.querySelectorAll("svg.fc .hover").forEach(g=>{if(!sv||g.ownerSVGElement!==sv)g.style.display="none";});
  document.querySelectorAll(".fc-wrap .tip").forEach(t=>{if(!sv||t.id!=="tip-"+sv.dataset.ch)t.style.display="none";});
  if(!sv)return;const C=CH[sv.dataset.ch];if(!C)return;const b=sv.getBoundingClientRect();const x=(e.clientX-b.left)*(C.W/b.width);
  const ts=C.t0+(x-C.L)/(C.X(C.t1)-C.L)*(C.t1-C.t0);if(ts<C.t0||ts>C.t1)return;
  let k=C.dd.findIndex(d=>Date.parse(d)>=ts);if(k<0)k=C.dd.length-1;const d=C.dd[k],v=C.cc[k];
  const a=[...C.ap].reverse().find(q=>q[0]<=d);const g=sv.querySelector(".hover");g.style.display="";
  const xx=C.X(Date.parse(d));g.children[0].setAttribute("x1",xx);g.children[0].setAttribute("x2",xx);
  g.children[1].setAttribute("cx",xx);g.children[1].setAttribute("cy",C.Y(v));
  if(a){g.children[2].style.display="";g.children[2].setAttribute("cx",xx);g.children[2].setAttribute("cy",C.Y(a[1]));}else g.children[2].style.display="none";
  const tp=document.getElementById("tip-"+sv.dataset.ch);tp.style.display="block";
  tp.innerHTML=`<b>${fd(d)}</b><div>Chiusura <b>${nf(v)}</b></div>${a?`<div>Target medio <b>${nf(a[1])}</b>${a[2]?` · ${a[2]} ${a[2]===1?"broker":"broker"}`:""}</div><div class="${pcls(a[1]/v-1)}">Upside ${pct(100*(a[1]/v-1))}</div>`:""}`;
  const px=(xx/C.W)*b.width;tp.style.left=Math.min(b.width-170,Math.max(0,px+12))+"px";tp.style.top="28px";});

   <div class="card"><div class="hd"><h2>Opzioni</h2><small>valore del sottostante, non del premio</small></div>${j.opts?.length?table("inv-o",ocols,j.opts,{def:"v",limit:15}):'<div class="empty-state">Nessuna opzione nel 13F.</div>'}</div>
   <div class="card"><div class="hd"><h2>Short su titoli europei</h2><small>CONSOB · AMF, soglia 0,5%</small></div>${j.shorts?.length?`<div class="bd">${j.shorts.map(s=>`<div class="stat"><span>${s[5]&&U[s[5]]?`<a href="#/t/${encodeURIComponent(s[5])}"><b>${esc(info(s[5]).name)}</b></a>`:`<b>${esc(s[0])}</b>`}<div class="mut" style="font-size:12px">${esc(s[1])} · ${esc(s[4])} · ${fd(s[3])}</div></span><b class="dn">−${nf(s[2],2)}%</b></div>`).join("")}</div>`:'<div class="empty-state">Nessuna posizione corta pubblica abbinata a questo gestore. Negli USA gli short per detentore non sono pubblici.</div>'}</div></div>
  <div class="card" style="margin-top:16px"><div class="hd"><h2>Trade recenti e com'è andata</h2><small>rendimento del titolo meno SPY dopo il deposito (vendite: segno invertito)</small></div>${j.trades?.length?table("inv-t",tcols,j.trades,{def:"d",limit:20}):'<div class="empty-state">Nessun trade rilevante.</div>'}</div>
  <div class="card" style="margin-top:16px"><div class="hd"><h2>Storico</h2><small>valore 13F e numero di posizioni per trimestre</small></div><div class="bd">${hist.slice().reverse().slice(0,16).map(h=>`<div class="stat"><span>${esc(quarterOf(h[0]))}</span><span style="display:flex;align-items:center;gap:8px"><i style="display:block;height:8px;border-radius:99px;background:var(--acc);width:${Math.max(3,180*(h[1]||0)/mxv)}px"></i><b>${usd(h[1])}</b><span class="mut">${h[2]} pos.</span></span></div>`).join("")}</div></div>`;}
async function ownCard(t){const j=await loadInst();if(!j||!(j.own||[]).includes(t))return "";
  const o=OWNC[t]||(OWNC[t]=await getJSON(`own/${encodeURIComponent(t)}.json`));if(!o)return "";
  const hcols=[{k:"r",l:"#",v:r=>r[8],h:r=>rkCell(r[8])},{k:"n",l:"Gestore",v:r=>r[1],h:r=>`<b>${esc(r[1])}</b><div class="mut" style="font-size:12px">${esc(quarterOf(r[2]))}</div>`},
    {k:"v",l:"Valore",num:1,v:r=>r[3],h:r=>usd(r[3])},{k:"w",l:"Peso nel portafoglio",num:1,v:r=>r[4],h:r=>pr(r[4],1)},
    {k:"c",l:"Variazione",v:r=>r[6],h:r=>chgPill(r[6])},{k:"d",l:"Δ azioni",num:1,v:r=>r[7],h:r=>r[6]==="new"?'<span class="mut">–</span>':`<span class="${pcls(r[7])}">${pp(r[7],0)}</span>`}];
  const hh=o.hist||[];const nb=o.holders.filter(r=>r[6]==="new"||r[6]==="add").length,ns=o.holders.filter(r=>r[6]==="trim").length+(o.exits||[]).length;
  const top=o.holders.filter(r=>r[8]&&r[8]<=50).length;
  const sh=o.shorts||[];
  return `<div class="card" style="margin-top:16px"><div class="hd"><h2>Investitori istituzionali</h2><small>13F SEC${o.us&&o.us!==t?` sulla quotazione USA ${esc(o.us)}`:""} · ${o.nhold} gestori seguiti · ${top} tra i top 50</small></div>
   <div class="grid kpis" style="padding:0 16px 8px">${kpiS("Gestori che lo hanno",o.nhold,"",hh.length>1?`${hh.at(-2)[1]} il trimestre prima`:"")}${kpiS("Comprano / aumentano",nb,"up")}${kpiS("Riducono / escono",ns,"dn")}
    ${kpiS("Short dichiarati",o.short_tot!=null?nf(o.short_tot,2)+"%":"n.d.",o.short_tot?"dn":"mut",o.short_tot!=null?`${sh.length} posizioni ≥ 0,5%`:(info(t).panel==="US"?"non pubblici per detentore negli USA":"nessuna sopra soglia"))}</div>
   ${o.holders.length?table("own-h",hcols,o.holders,{def:"v",limit:10,rowAttr:r=>`data-go="inv/${r[0]}"`}):'<div class="empty-state">Nessun gestore seguito lo possiede nell\'ultimo trimestre.</div>'}
   ${o.exits?.length?`<div class="bd"><div class="kk">Usciti nell'ultimo trimestre</div>${o.exits.map(r=>`<a class="pill p-dn" style="margin:3px" href="#/inv/${r[0]}">${esc(r[1])}</a>`).join("")}</div>`:""}
   ${o.opts?.length?`<div class="bd"><div class="kk">Opzioni dichiarate</div>${o.opts.slice(0,12).map(r=>`<div class="stat"><span><a href="#/inv/${r[0]}"><b>${esc(r[1])}</b></a></span><span><span class="pill ${r[2]==="PUT"?"p-dn":"p-up"}">${r[2]==="PUT"?"Put":"Call"}</span> ${usd(r[3])}</span></div>`).join("")}</div>`:""}
   ${sh.length?`<div class="bd"><div class="kk">Posizioni corte nette pubblicate</div>${sh.map(s=>`<div class="stat"><span>${s[4]?`<a href="#/inv/${s[4]}"><b>${esc(s[0])}</b></a>`:`<b>${esc(s[0])}</b>`}<div class="mut" style="font-size:12px">${esc(s[3])} · ${fd(s[2])}</div></span><b class="dn">−${nf(s[1],2)}%</b></div>`).join("")}</div>`:""}
   <div class="bd mut" style="font-size:12px">${esc(o.short_note)} Liquidità dei gestori: n.d. (i 13F non la riportano).</div></div>`;}
/* ---------- notifiche ---------- */
let FEED=[];
function feedRow(e){return `<a class="stat" style="text-decoration:none;color:inherit" href="${esc(e.link||"#/investors")}"><span><b>${esc(e.title)}</b>${e.important?' <span class="pill p-wr">importante</span>':""}<div class="mut" style="font-size:12px">${esc(e.text)}</div></span><span class="mut" style="white-space:nowrap">${fd((e.date||e.ts||"").slice(0,10))}</span></a>`;}
async function loadFeed(){const f=await getJSON("feed.json");if(!f)return;FEED=f;const seen=LS.get("asnp.feedSeen","");
  const un=FEED.filter(e=>e.ts>seen);const b=document.getElementById("bellN");b.textContent=un.length>99?"99+":un.length;b.style.display=un.length?"":"none";
  if(window.Notification&&Notification.permission==="granted"){const told=LS.get("asnp.feedTold","");
    un.filter(e=>e.important&&e.ts>told).slice(0,3).forEach(e=>{try{new Notification(e.title,{body:e.text,tag:e.id})}catch(_){}});
    if(un.length)LS.set("asnp.feedTold",un[0].ts);}}
function toggleFeed(){const p=document.getElementById("feedP");if(p.style.display==="block"){p.style.display="none";return;}
  const seen=LS.get("asnp.feedSeen","");
  p.innerHTML=`<div class="hd" style="padding:12px 14px"><b>Novità</b><span>${window.Notification&&Notification.permission!=="granted"?'<button class="btn" type="button" id="notifOn" style="padding:4px 10px">Attiva notifiche</button>':""}</span></div>
   <div style="max-height:60vh;overflow:auto;padding:0 14px 10px">${FEED.length?FEED.slice(0,40).map(e=>`<div style="${e.ts>seen?"":"opacity:.7"}">${feedRow(e)}</div>`).join(""):'<div class="empty-state">Nessuna novità per ora.</div>'}</div>
   <div class="mut" style="font-size:11.5px;padding:8px 14px;border-top:1px solid var(--line)">Nuovi 13F dei gestori seguiti e variazioni degli short europei, controllati ogni 3 ore. Per le notifiche sul telefono: app ntfy, argomento configurato nel secret NTFY_TOPIC.</div>`;
  p.style.display="block";if(FEED[0])LS.set("asnp.feedSeen",FEED[0].ts);document.getElementById("bellN").style.display="none";
  const n=document.getElementById("notifOn");if(n)n.onclick=async()=>{await Notification.requestPermission();p.style.display="none";toggleFeed();};}
document.getElementById("bell").onclick=e=>{e.stopPropagation();toggleFeed();};
document.addEventListener("click",e=>{const p=document.getElementById("feedP");if(p.style.display==="block"&&!e.target.closest("#feedP"))p.style.display="none";});
setInterval(loadFeed,10*60*1000);

/* ---------- router ---------- */
function navHtml(cur){return PAGES.map(([k,l,ic])=>`<a href="#/${k}" ${cur===k?'aria-current="page"':""}>${svg(ic)}<span>${l}</span></a>`).join("");}
let seq=0;
async function render(){if(!D)return;const my=++seq;
  const [p,...rest]=(location.hash.replace(/^#\/?/,"")||"home").split("/");const arg=rest.join("/");
  const cur=p==="t"||p==="idx"?"":p==="inv"?"investors":p;document.getElementById("nav").innerHTML=navHtml(cur);document.getElementById("bnav").innerHTML=navHtml(cur);
  const f={home:pHome,moves:pMoves,targets:pTargets,revisions:pRevisions,brokers:pBrokers,ranking:pRanking,idx:pIndex,watchlist:pWatch,pipeline:pPipeline,t:pTicker,investors:pInvestors,inv:pInvestor}[p]||pHome;
  const html=await f(decodeURIComponent(arg||""));if(my!==seq)return;
  document.getElementById("page").innerHTML=html;
  if(p==="t"&&U[decodeURIComponent(arg)]){const t=decodeURIComponent(arg);ownCard(t).then(h=>{if(my!==seq||!h)return;const pg=document.getElementById("page");pg.insertAdjacentHTML("beforeend",h);});}
  document.title=p==="t"&&U[arg]?`${info(decodeURIComponent(arg)).name} · ASNP`:"ASNP · Analyst Snapshot";}
document.getElementById("page").addEventListener("click",e=>{
  const b=e.target.closest("[data-set]");if(b){const k=b.dataset.set;st[k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;if(k==="mkt"||k==="win")LS.set("asnp."+k,st[k]);st.limit={};render();return;}
  const s=e.target.closest("[data-sort]");if(s){const o=st.sort[s.dataset.sort];if(o.k===s.dataset.k)o.desc=!o.desc;else{o.k=s.dataset.k;o.desc=true;}render();return;}
  const m=e.target.closest("[data-more]");if(m){st.limit[m.dataset.more]=(st.limit[m.dataset.more]||100)+200;render();return;}
  const w=e.target.closest("[data-wl]");if(w){const s=wl(),t=w.dataset.wl;s.has(t)?s.delete(t):s.add(t);LS.set("asnp.wl",[...s]);render();return;}
  const r=e.target.closest("[data-go]");if(r&&!e.target.closest("a")){location.hash="#/"+r.dataset.go;scrollTo(0,0);}});
load();
</script>
