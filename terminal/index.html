<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASNP · Analyst Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --card2:#f9fafb; --line:#e5e7eb; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --acc:#0f766e; --acc-soft:#e6f4f2; --acc-ink:#ffffff; --up:#15803d; --up-soft:#e8f5ec; --dn:#b91c1c; --dn-soft:#fdecec;
  --warn:#b45309; --warn-soft:#fef3e2; --info:#1d4ed8; --info-soft:#e8effd; --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  --r:14px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --card:#121821; --card2:#0f141b; --line:#222c38; --ink:#e7edf4; --ink2:#c3cdd9; --muted:#8593a3;
  --acc:#2dd4bf; --acc-soft:#0f2b2a; --acc-ink:#04201d; --up:#4ade80; --up-soft:#12281b; --dn:#f87171; --dn-soft:#2d1515;
  --warn:#fbbf24; --warn-soft:#2b220f; --info:#93b4ff; --info-soft:#141f38; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f14; --card:#121821; --card2:#0f141b; --line:#222c38; --ink:#e7edf4; --ink2:#c3cdd9; --muted:#8593a3;
  --acc:#2dd4bf; --acc-soft:#0f2b2a; --acc-ink:#04201d; --up:#4ade80; --up-soft:#12281b; --dn:#f87171; --dn-soft:#2d1515;
  --warn:#fbbf24; --warn-soft:#2b220f; --info:#93b4ff; --info-soft:#141f38; --shadow:none; color-scheme:dark; }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500}
nav a svg{width:18px;height:18px;flex:none;opacity:.8}
nav a:hover{background:var(--card2)}
nav a[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}
nav a[aria-current="page"] svg{opacity:1}
.aside-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
#status{display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.main{min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  padding:14px 28px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.search{position:relative;flex:1;max-width:620px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--acc)}
.search > svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px Inter;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.14);overflow:hidden;display:none}
#results .r{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
#results .r.on,#results .r:hover{background:var(--card2)}
#results .r .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .r .sub{color:var(--muted);font-size:12px}
#results .empty{padding:14px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

.page{padding:24px 28px 80px;max-width:1440px;width:100%}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.lbl{font-size:12px;color:var(--muted);margin-right:-8px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card > .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.card > .hd h2{font-size:15px;margin:0;letter-spacing:-.01em}
.card > .hd small{color:var(--muted)}
.card > .bd{padding:0 18px 16px}
.kpi{padding:16px 18px}
.kpi .k{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--muted)} .warnc{color:var(--warn)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--card)}
th.num,td.num{text-align:right}
th[aria-sort]::after{content:" ↓";color:var(--acc)} th[aria-sort="ascending"]::after{content:" ↑"}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--card2)}
.tk{display:flex;flex-direction:column;line-height:1.25}
.tk b{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tk span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-up{background:var(--up-soft);color:var(--up)} .p-dn{background:var(--dn-soft);color:var(--dn)}
.p-in{background:var(--info-soft);color:var(--info)} .p-nt{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.p-wr{background:var(--warn-soft);color:var(--warn)}
.mkt{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.rt{color:var(--muted)} .rt b{color:var(--ink);font-weight:600}
table.mini td{white-space:normal}
table.mini td.num{white-space:nowrap}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer;color:var(--ink2)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13px}
.empty-state{padding:30px 18px;text-align:center;color:var(--muted)}

/* scheda titolo */
.co-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.co-head h1{font-size:28px}
.co-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.co-meta code{font:12.5px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.px{text-align:right}
.px .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:6px 18px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.range{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--dn-soft),var(--card2),var(--up-soft));border:1px solid var(--line);margin:22px 4px 26px}
.range .m{position:absolute;top:-6px;width:3px;height:18px;border-radius:2px;transform:translateX(-50%)}
.rleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:-18px 0 8px}
.rleg i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--card2);margin:8px 0}
.dist div{height:100%}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.stat:last-child{border-bottom:0}
.stat span:first-child{color:var(--muted)}

.bar-s{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-s i{display:block;height:8px;border-radius:99px;background:var(--acc)}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.rk.g1{background:#f5c542;color:#3b2a00;border-color:transparent}.rk.g2{background:#cfd6de;color:#1d2733;border-color:transparent}.rk.g3{background:#d99a62;color:#2e1603;border-color:transparent}
.method{font-size:13.5px;color:var(--ink2)} .method li{margin:4px 0}
.bottomnav{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  header{padding:10px 16px}
  .page{padding:18px 16px 96px}
  .two{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto}
  .bottomnav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px}
  .bottomnav a svg{width:20px;height:20px}
  .bottomnav a[aria-current="page"]{color:var(--acc)}
  .search kbd{display:none}
  .hide-m{display:none}
  .px{text-align:left}
  .co-head{align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></div>
      <div><b>Analyst Snapshot</b><small>Rating · Target · EPS</small></div></div>
    <nav id="nav"></nav>
    <div class="aside-foot"><div id="status"></div><button class="btn" id="themeBtn" type="button">Tema chiaro/scuro</button></div>
  </aside>
  <div class="main">
    <header>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Cerca per nome, ISIN o ticker…" aria-label="Cerca titolo">
        <kbd>/</kbd>
        <div id="results" role="listbox"></div>
      </div>
      <div class="hdr-right"><span class="mut hide-m" id="asof"></span></div>
    </header>
    <div class="page" id="page"><div class="empty-state">Caricamento dati…</div></div>
  </div>
</div>
<nav class="bottomnav" id="bnav"></nav>

<script>
"use strict";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
(function(){const t=LS.get("asnp.theme",null);if(t)document.documentElement.dataset.theme=t;})();
document.getElementById("themeBtn").onclick=()=>{
  const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const t=dark?"light":"dark";document.documentElement.dataset.theme=t;LS.set("asnp.theme",t);render();};

const IC={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 moves:'<path d="M7 17V7"/><path d="m4 10 3-3 3 3"/><path d="M17 7v10"/><path d="m14 14 3 3 3-3"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',
 rev:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/>',
 broker:'<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2"/>',
 star:'<path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5L12 16.7 7.1 19.2l.9-5.5-4-3.9 5.5-.8z"/>',
 trophy:'<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const PAGES=[["home","Panoramica","home"],["moves","Movimenti","moves"],["targets","Target price","target"],
  ["revisions","Revisioni","rev"],["ranking","Classifica broker","trophy"],["brokers","Broker","broker"],["watchlist","Watchlist","star"],["pipeline","Dati","db"]];
const MKTS=[["ALL","Tutti"],["US","USA"],["UK","UK"],["IT","Italia"],["DE","Germania"],["FR","Francia"],["EU50","Euro Stoxx 50"]];
const MKT_LBL={US:"USA",UK:"UK",IT:"IT",DE:"DE",FR:"FR",NL:"NL",ES:"ES",BE:"BE",FI:"FI",IE:"IE",PT:"PT"};
const IDX_LBL={SP500:"S&P 500",UKX:"FTSE 100",MCX:"FTSE 250",FTSEMIB:"FTSE MIB",DAX:"DAX 40",CAC:"CAC 40",SX5E:"Euro Stoxx 50"};
const WINS=[[1,"1G"],[5,"5G"],[20,"1M"],[60,"3M"],[250,"1A"]];
const RLBL={1:"Strong Buy",2:"Buy",3:"Hold",4:"Underperform",5:"Sell"};

let D=null, U={}, EV=[], BR=[], ASOF=null, IDX=[];
const st={mkt:LS.get("asnp.mkt","ALL"),win:LS.get("asnp.win",5),type:"REL",sort:{},limit:{}};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(v,d=2)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null||!isFinite(v)?"–":(v>0?"+":"")+nf(v,d)+"%";
const pcls=v=>v==null||!isFinite(v)?"mut":v>0?"up":v<0?"dn":"mut";
const fd=s=>{if(!s)return"–";const[y,m,d]=s.split("-");return `${d}/${m}/${y.slice(2)}`};
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const wl=()=>new Set(LS.get("asnp.wl",[]));
function bdBack(iso,n){const d=new Date(iso+"T12:00:00Z");let k=0;while(k<n){d.setUTCDate(d.getUTCDate()-1);const w=d.getUTCDay();if(w&&w<6)k++;}return d.toISOString().slice(0,10);}

function info(t){const u=U[t]||[];return{t,name:u[0]||u[6]||t,panel:u[1]||"",idx:(u[2]||"").split(";").filter(Boolean),isin:u[3]||"",cur:u[4]||"",lname:u[6]||"",exch:u[7]||""};}
function inMkt(t){if(st.mkt==="ALL")return true;const i=info(t);return st.mkt==="EU50"?i.idx.includes("SX5E"):i.panel===st.mkt;}
function cat(e){const f=e.fn,t=e.tn;
  if(f!=null&&t!=null&&Math.abs(t-f)>=2)return t<f?"DBL_UP":"DBL_DN";
  if(f!=null&&t!=null){if(f<=2&&t>=3)return"BH_DN";if(f>=3&&t<=2)return"BH_UP";if(f<=3&&t>=4)return"HS_DN";if(f>=4&&t<=3)return"HS_UP";}
  if(e.a==="up")return"UP";if(e.a==="down")return"DN";if(e.a==="init")return"INIT";return"OTHER";}
const CAT={DBL_UP:["Doppio upgrade","p-up"],DBL_DN:["Doppio downgrade","p-dn"],BH_UP:["Upgrade a Buy","p-up"],BH_DN:["Downgrade da Buy","p-dn"],
  HS_UP:["Upgrade da Sell","p-up"],HS_DN:["Downgrade a Sell","p-dn"],UP:["Upgrade","p-up"],DN:["Downgrade","p-dn"],INIT:["Inizio copertura","p-in"],OTHER:["Conferma","p-nt"]};
const RANK={DBL_UP:0,DBL_DN:0,BH_UP:1,BH_DN:1,HS_UP:1,HS_DN:1,UP:2,DN:2,INIT:3,OTHER:4};
function ptChg(e){return e.pf&&e.pt?100*(e.pt/e.pf-1):null;}
function lastPx(t){return (D.last||{})[t]||null;}
function upNow(e){const l=lastPx(e.t);return e.pt&&l&&l[1]?100*(e.pt/l[1]-1):null;}
function upEv(e){return e.pt&&e.cx?100*(e.pt/e.cx-1):null;}

async function load(){
  let raw;
  try{const r=await fetch("terminal.json",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);raw=await r.json();}
  catch(err){document.getElementById("page").innerHTML=`<div class="card empty-state">Dati non disponibili (${esc(err.message)}). Il file terminal.json lo pubblica il workflow 3-terminale.</div>`;return;}
  D=raw;U=D.universe||{};BR=D.brokers||[];ASOF=D.meta.as_of;
  EV=D.events.map(r=>({t:r[0],d:r[1],b:BR[r[2]]||"—",a:r[3],rf:r[4],rt:r[5],fn:r[6],tn:r[7],fs:r[8],bf:r[9],pf:r[10],pt:r[11],pa:r[12],cx:r[13]}));
  EV.forEach(e=>e.c=cat(e));
  IDX=Object.keys(U).map(t=>{const i=info(t);const base=t.split(".")[0];
    return{t,i,k:[norm(t),norm(base)],n:norm(i.name+" "+i.lname),isin:norm(i.isin)}});
  document.getElementById("asof").textContent=`Dati al ${fd(ASOF)} · aggiornato ${D.meta.built_at}`;
  const last=(D.snapshots||[]).slice(-1)[0];
  document.getElementById("status").innerHTML=`<span><span class="dot" style="background:${last&&!last[2]?"var(--up)":"var(--warn)"}"></span>Pipeline ${last&&!last[2]?"ok":"da controllare"}</span><span>Snapshot ${fd(ASOF)}</span>`;
  addEventListener("hashchange",render);render();
}

/* ---------- ricerca ---------- */
const qi=document.getElementById("q"),res=document.getElementById("results");let hits=[],hi=0;
function search(q){q=norm(q.trim());if(!q)return[];const out=[];
  for(const x of IDX){let s=0;
    if(x.k[0]===q||x.k[1]===q)s=100;else if(x.isin&&x.isin===q)s=95;else if(x.k[0].startsWith(q)||x.k[1].startsWith(q))s=70;
    else if(x.isin&&q.length>=4&&x.isin.startsWith(q))s=65;else if(x.n.startsWith(q))s=60;else if((" "+x.n).includes(" "+q))s=50;else if(x.n.includes(q))s=40;
    if(s)out.push([s,x]);}
  return out.sort((a,b)=>b[0]-a[0]||a[1].i.name.localeCompare(b[1].i.name)).slice(0,10).map(a=>a[1]);}
function showRes(){if(!qi.value.trim()){res.style.display="none";return;}
  res.style.display="block";
  res.innerHTML=hits.length?hits.map((x,k)=>{const l=lastPx(x.t);return `<div class="r${k===hi?" on":""}" data-t="${esc(x.t)}" role="option">
    <span class="mkt">${esc(MKT_LBL[x.i.panel]||x.i.panel)}</span>
    <div style="min-width:0;flex:1"><div class="nm">${esc(x.i.name)}</div><div class="sub">${esc(x.t)}${x.i.isin?" · "+esc(x.i.isin):""}</div></div>
    ${l?`<span class="mut">${nf(l[1])}</span>`:""}</div>`}).join(""):`<div class="empty">Nessun titolo trovato. Prova con il nome, l'ISIN (es. IT0003132476) o il ticker.</div>`;}
qi.addEventListener("input",()=>{hits=search(qi.value);hi=0;showRes();});
qi.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){hi=Math.min(hi+1,hits.length-1);showRes();e.preventDefault();}
  else if(e.key==="ArrowUp"){hi=Math.max(hi-1,0);showRes();e.preventDefault();}

  else if(e.key==="Escape"){qi.value="";showRes();qi.blur();}});

qi.addEventListener("blur",()=>setTimeout(()=>res.style.display="none",120));

addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus();}});

function coCell(t){const i=info(t);return `<div class="tk"><b title="${esc(i.name)}">${esc(i.name)}</b><span>${esc(t)} · ${esc(MKT_LBL[i.panel]||i.panel)}</span></div>`;}
function rating(e){const f=e.rf?`${esc(e.rf)} → `:"";return `<span class="rt">${f}<b>${esc(e.rt||"–")}</b></span>`;}
function ptCell(e){if(!e.pt)return'<span class="mut">–</span>';const c=ptChg(e);
  return `${e.pf?`<span class="mut">${nf(e.pf)} → </span>`:""}<b>${nf(e.pt)}</b>${c!=null?` <span class="${pcls(c)}" style="font-size:12px">${pct(c)}</span>`:""}`;}
/* tabella ordinabile: cols=[{k,l,v(row)->valore ordinamento,h(row)->html,num}] */
function table(id,cols,rows,{def,desc=true,limit=100,rowAttr}={}){
  const s=st.sort[id]||(st.sort[id]={k:def||cols[0].k,desc});
  const c=cols.find(c=>c.k===s.k)||cols[0];
  const r=[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return (x<y?-1:x>y?1:0)*(s.desc?-1:1);});
  const lim=st.limit[id]||limit;
  return `<div class="tw"><table><thead><tr>${cols.map(k=>`<th class="${k.num?"num":""}" data-sort="${id}" data-k="${k.k}"${k.k===s.k?` aria-sort="${s.desc?"descending":"ascending"}"`:""}>${k.l}</th>`).join("")}</tr></thead>
  <tbody>${r.slice(0,lim).map(x=>`<tr ${rowAttr?rowAttr(x):""}>${cols.map(k=>`<td class="${k.num?"num":""}">${k.h(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  ${r.length>lim?`<button class="more" data-more="${id}">Mostra altri (${r.length-lim})</button>`:""}
  ${r.length?"":`<div class="empty-state">Nessun dato con questi filtri.</div>`}`;}

  {k:"b",l:"Broker",v:e=>e.b,h:e=>esc(e.b)},

  ${toolbar()}

    ${kpi("Upgrade",ups,"up")}${kpi("Downgrade",dns,"dn")}${kpi("Inizi copertura",ini,"")}${kpi("Target alzati",ptu,"up")}${kpi("Target tagliati",ptd,"dn")}${kpi("Titoli toccati",new Set(ev.map(e=>e.t)).size,"")}
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><div class="hd"><h2>Movimenti rilevanti</h2><a class="mut" href="#/moves">Tutti →</a></div>
      ${mini(rel,e=>`<tr data-go="t/${esc(e.t)}"><td>${coCell(e.t)}</td><td><span class="pill ${CAT[e.c][1]}">${CAT[e.c][0]}</span><div class="mut" style="font-size:12px;margin-top:3px">${esc(e.b)} · ${fd(e.d)}</div></td><td class="num">${ptCell(e)}</td></tr>`)}</div>
    <div class="card"><div class="hd"><h2>Variazioni di target più ampie</h2><a class="mut" href="#/targets">Tutte →</a></div>
      ${mini(pts,e=>`<tr data-go="t/${esc(e.t)}"><td>${coCell(e.t)}</td><td><div>${esc(e.b)}</div><div class="mut" style="font-size:12px">${fd(e.d)}</div></td><td class="num">${ptCell(e)}<div style="font-size:12px" class="${pcls(upNow(e))}">vs chiusura ${pct(upNow(e))}</div></td></tr>`)}</div>
    <div class="card"><div class="hd"><h2>Revisioni EPS più positive</h2><small>FY corrente</small></div>
      ${mini(best,r=>`<tr data-go="t/${esc(r.t)}"><td>${coCell(r.t)}</td><td class="num"><span class="up">${r.up}↑</span> <span class="dn">${r.dn}↓</span></td><td class="num"><b class="${pcls(r.b)}">${pct(r.b*100,0)}</b></td></tr>`)}</div>
    <div class="card"><div class="hd"><h2>Revisioni EPS più negative</h2><small>FY corrente</small></div>
      ${mini(worst,r=>`<tr data-go="t/${esc(r.t)}"><td>${coCell(r.t)}</td><td class="num"><span class="up">${r.up}↑</span> <span class="dn">${r.dn}↓</span></td><td class="num"><b class="${pcls(r.b)}">${pct(r.b*100,0)}</b></td></tr>`)}</div>
  </div>`;}

function breadthRows(fy=1){const rv=D.revisions||[];const dates=[...new Set(rv.map(r=>r[1]))].sort();const L=dates.at(-1),P=dates.at(-2);

  <div class="card" style="margin-top:16px"><div class="hd"><h2>Snapshot notturni</h2></div><div class="tw"><table><thead><tr><th>Data</th><th class="num">Titoli</th><th class="num">Falliti</th><th class="num">Righe rating</th><th class="num">Con target</th><th class="num">Revisioni</th><th class="num">Target consenso</th><th class="num">Prezzi</th><th>Grade non mappate</th></tr></thead><tbody>
  ${[...sn].reverse().map(s=>`<tr><td>${fd(s[0])}</td><td class="num">${s[1]??"–"}</td><td class="num ${s[2]?"warnc":""}">${s[2]??"–"}</td><td class="num">${s[3]??"–"}</td><td class="num">${s[8]??"–"}</td><td class="num">${s[4]??"–"}</td><td class="num">${s[6]??"–"}</td><td class="num">${s[7]??"–"}</td><td class="mut">${esc(s[5]||"")}</td></tr>`).join("")}</tbody></table></div></div>
  <p class="mut" style="font-size:12px;margin-top:16px">Fonte: Yahoo Finance via yfinance, raccolta ogni notte da GitHub Actions. Il nome del singolo analista non è disponibile in questa fonte.</p>`;}

let BRK=null;
async function loadRank(){if(BRK)return BRK;try{const r=await fetch("brokers.json",{cache:"no-cache"});if(r.ok)BRK=await r.json();}catch(e){}return BRK;}
function rankRows(j){return j.rows.map(r=>Object.fromEntries(j.cols.map((c,i)=>[c,r[i]])));}
const bps=v=>v==null?"–":(v>0?"+":"")+nf(v*10000,0)+" bp";
async function pRanking(){
  const j=await loadRank();
  if(!j)return `<h1>Classifica broker</h1><div class="card empty-state">La classifica non è ancora stata calcolata: la genera il workflow 3-terminale.</div>`;
  const rows=rankRows(j),ranked=rows.filter(r=>r.rank!=null),other=rows.filter(r=>r.rank==null);
  const g=j.global,m=j.model||{},p=j.persistence||{};
  const rel=p.rank_corr==null?{t:"Non ancora misurabile",c:"",d:esc(p.note||"")}:
    p.rank_corr>=.3?{t:"Buona",c:"up",d:`La classifica calcolata fino al ${fd(p.cutoff)} ha anticipato bene i risultati successivi (ρ = ${nf(p.rank_corr,2)} su ${p.n_brokers} broker).`}:
    p.rank_corr>=.1?{t:"Debole",c:"warnc",d:`La classifica passata ha anticipato solo in parte i risultati successivi (ρ = ${nf(p.rank_corr,2)} su ${p.n_brokers} broker).`}:
    {t:"Non affidabile",c:"dn",d:`La classifica calcolata fino al ${fd(p.cutoff)} non ha anticipato i risultati successivi (ρ = ${nf(p.rank_corr,2)} su ${p.n_brokers} broker): per ora le differenze tra broker sono in gran parte rumore.`};
  const cols=[
    {k:"rank",l:"#",v:r=>r.rank,h:r=>`<span class="rk ${r.rank<=3?"g"+r.rank:""}">${r.rank}</span>`},
    {k:"broker",l:"Broker",v:r=>r.broker,h:r=>`<b>${esc(r.broker)}</b><div class="mut" style="font-size:12px">${r.n_tickers} titoli</div>`},
    {k:"score",l:"Punteggio",v:r=>r.score,h:r=>`<div class="bar-s"><i style="width:${Math.max(4,r.score)}px"></i><b>${nf(r.score,0)}</b></div>`},
    {k:"n_eval",l:"Analisi valutate",num:1,v:r=>r.n_eval,h:r=>r.n_eval},
    {k:"hit",l:"Successo 3M",num:1,v:r=>r.hit,h:r=>`<b>${pct(r.hit==null?null:r.hit*100,1).replace("+","")}</b><div class="mut" style="font-size:12px">grezzo ${pct(r.hit_raw==null?null:r.hit_raw*100,0).replace("+","")}</div>`},
    {k:"alpha",l:"Alfa medio 3M",num:1,v:r=>r.alpha,h:r=>`<span class="${pcls(r.alpha)}">${pct(r.alpha==null?null:r.alpha*100,2)}</span>`},
    {k:"ml",l:"Abilità ML",num:1,v:r=>r.ml,h:r=>`<span class="${pcls(r.ml)}">${bps(r.ml)}</span>`},
    {k:"ic",l:"IC target",num:1,v:r=>r.ic,h:r=>r.ic==null?'<span class="mut">–</span>':`<span class="${pcls(r.ic)}">${nf(r.ic,2)}</span>`},
    {k:"pt_hit",l:"Target raggiunti 12M",num:1,v:r=>r.pt_hit,h:r=>r.pt_hit==null?'<span class="mut">–</span>':pct(r.pt_hit*100,0).replace("+","")},
    {k:"hit_1m",l:"1M",num:1,v:r=>r.hit_1m,h:r=>r.hit_1m==null?'<span class="mut">–</span>':nf(r.hit_1m*100,0)+"%"},
    {k:"hit_6m",l:"6M",num:1,v:r=>r.hit_6m,h:r=>r.hit_6m==null?'<span class="mut">–</span>':nf(r.hit_6m*100,0)+"%"},
    {k:"hit_12m",l:"12M",num:1,v:r=>r.hit_12m,h:r=>r.hit_12m==null?'<span class="mut">–</span>':nf(r.hit_12m*100,0)+"%"}];
  const hide=new Set([...(m.informative===false?["ml"]:[]),...(g.pt_hit==null?["pt_hit"]:[]),...(rows.every(r=>r.hit_12m==null)?["hit_12m"]:[])]);
  cols.splice(0,cols.length,...cols.filter(c=>!hide.has(c.k)));
  const ocols=[{k:"broker",l:"Broker",v:r=>r.broker,h:r=>`<b>${esc(r.broker)}</b>`},{k:"n_events",l:"Analisi",num:1,v:r=>r.n_events,h:r=>r.n_events},
    {k:"n_eval",l:"Valutate a 3M",num:1,v:r=>r.n_eval,h:r=>r.n_eval},{k:"hit_raw",l:"Successo grezzo",num:1,v:r=>r.hit_raw,h:r=>r.hit_raw==null?"–":nf(r.hit_raw*100,0)+"%"}];
  return `<h1>Classifica broker</h1><p class="lead">Quanto le analisi di ciascun broker hanno anticipato l'andamento del titolo rispetto al suo indice. Ricalcolata ogni notte al ${fd(j.as_of)}; in classifica chi ha almeno ${j.min_n} analisi valutate.</p>
  <div class="grid kpis">
    ${kpiS("Analisi valutate (3M)",g.n_eval.toLocaleString("it-IT"),"")}
    ${kpiS("Successo medio",nf(g.hit*100,1)+"%",g.hit>=.5?"up":"dn")}
    ${kpiS("Alfa medio per analisi",pct(g.alpha*100,2),pcls(g.alpha))}
    ${kpiS("Target raggiunti in 12M",g.pt_hit==null?"–":nf(g.pt_hit*100,0)+"%","",g.n_pt?`${g.n_pt} target valutati`:"")}
    ${kpiS("Affidabilità classifica",rel.t,rel.c)}
  </div>
  <div class="note" style="margin-top:16px;${rel.c==="up"?"background:var(--up-soft);color:var(--up)":""}">${rel.d} ${m.informative===false?`Il modello ML non trova differenze significative tra broker (R² fuori campione ≤ 0): la colonna "Abilità ML" resta vuota e il punteggio usa le altre metriche.`:m.oos_r2!=null?`Il modello ML spiega fuori campione il ${nf(m.oos_r2*100,1)}% della variabilità dei rendimenti.`:""}</div>
  <div class="card"><div class="hd"><h2>Classifica</h2><small>${ranked.length} broker</small></div>${table("rank",cols,ranked,{def:"rank",desc:false,limit:200,rowAttr:r=>`data-go="brokers/${encodeURIComponent(r.broker)}"`})}</div>
  ${other.length?`<div class="card" style="margin-top:16px"><div class="hd"><h2>Campione insufficiente</h2><small>meno di ${j.min_n} analisi valutate</small></div>${table("rank-o",ocols,other,{def:"n_eval",limit:30,rowAttr:r=>`data-go="brokers/${encodeURIComponent(r.broker)}"`})}</div>`:""}
  <div class="card" style="margin-top:16px"><div class="hd"><h2>Come è calcolata</h2></div><div class="bd method"><ul>
    <li><b>Ingresso</b>: chiusura del giorno dell'analisi, dopo la reazione del mercato. Si misura la capacità di prevedere, non l'effetto della notizia.</li>
    <li><b>Risultato</b>: rendimento del titolo meno quello del suo indice (S&amp;P 500, FTSE 100/250, FTSE MIB, DAX, CAC 40, Euro Stoxx 50) a 1, 3, 6 e 12 mesi.</li>
    <li><b>Successo</b>: Buy o upgrade con il titolo che batte l'indice, Sell o downgrade con il titolo che fa peggio. Gli Hold non contano.</li>
    <li><b>Alfa medio</b>: rendimento in eccesso ottenuto seguendo le indicazioni del broker (comprando i Buy, vendendo i Sell).</li>
    <li><b>IC target</b>: correlazione di rango fra l'upside implicito nel target e il rendimento realizzato. <b>Target raggiunti</b>: il prezzo ha toccato il target entro 12 mesi.</li>
    <li><b>Abilità ML</b>: regressione ridge con cross-validation temporale. Stima il contributo del broker al rendimento a 3 mesi al netto di momentum, volatilità, mercato e upside del target. Se i dati non distinguono i broker, la regolarizzazione porta tutti vicino a zero.</li>
    <li><b>Correzione per il campione</b>: i tassi di ogni broker sono avvicinati alla media generale in proporzione a quante analisi ha (${j.min_n} per entrare, peso della media pari a 30 analisi). Così pochi colpi fortunati non bastano per salire in classifica.</li>
    <li><b>Punteggio</b>: media pesata dei valori standardizzati (ML ${j.weights.ml*100}%, successo ${j.weights.hit*100}%, alfa ${j.weights.alpha*100}%, IC ${j.weights.ic*100}%, target ${(j.weights.pt_hit+j.weights.pt_err)*100}%), espressa in percentile 0–100.</li>
    <li><b>Affidabilità</b>: la classifica calcolata sulle analisi più vecchie viene confrontata con i risultati dei broker su quelle più recenti.</li>
    <li>Fonte: Yahoo Finance. Il nome del singolo analista non è disponibile, quindi la classifica è per casa di ricerca.</li></ul></div></div>`;}
function kpiS(k,v,c,s){return `<div class="card kpi"><div class="k">${k}</div><div class="v ${c}" style="font-size:24px">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`;}

function brokerCurrent(t){const m={};for(const e of EV){if(e.t!==t||e.tn==null)continue;const x=m[e.b];if(!x||e.d>x.d)m[e.b]=e;}
  const cut=bdBack(ASOF,260);return Object.values(m).filter(e=>e.d>=cut);}

async function pTicker(t){
  if(!U[t])return `<div class="card empty-state">Titolo ${esc(t)} non presente nell'universo.</div>`;
  const i=info(t),l=lastPx(t),g=(D.targets||{})[t],ev=EV.filter(e=>e.t===t),bc=brokerCurrent(t).sort((a,b)=>a.tn-b.tn||b.d.localeCompare(a.d));
  const ch=l&&l[2]?100*(l[1]/l[2]-1):null,inW=wl().has(t);
  const nb=bc.filter(e=>e.tn<=2).length,nh=bc.filter(e=>e.tn===3).length,ns=bc.filter(e=>e.tn>=4).length,avg=bc.length?bc.reduce((s,e)=>s+e.tn,0)/bc.length:null;
  const bpt=bc.filter(e=>e.pt).map(e=>e.pt);const mean=g?.[0]??(bpt.length?bpt.reduce((a,b)=>a+b,0)/bpt.length:null);
  const lo=g?.[3]??(bpt.length?Math.min(...bpt):null),hi=g?.[2]??(bpt.length?Math.max(...bpt):null);
  const up=mean&&l?100*(mean/l[1]-1):null;
  const rv=(D.revisions||[]).filter(r=>r[0]===t);const rl=rv.filter(r=>r[1]===rv.at(-1)?.[1]);
  let series=null;try{const r=await fetch(`t/${encodeURIComponent(t)}.json`,{cache:"no-cache"});if(r.ok)series=await r.json();}catch(e){}
  const rng=lo!=null&&hi!=null&&l?rangeBar(lo,hi,mean,l[1]):"";
  const bcols=[{k:"b",l:"Broker",v:e=>e.b,h:e=>`<b>${esc(e.b)}</b>`},{k:"r",l:"Rating",v:e=>e.tn,h:e=>`<span class="pill ${e.tn<=2?"p-up":e.tn>=4?"p-dn":"p-nt"}">${esc(e.rt)}</span>`},
    {k:"pt",l:"Target",num:1,v:e=>e.pt,h:ptCell},{k:"un",l:"Upside oggi",num:1,v:upNow,h:e=>`<span class="${pcls(upNow(e))}">${pct(upNow(e))}</span>`},{k:"d",l:"Data",v:e=>e.d,h:e=>fd(e.d)}];
  const hcols=EVCOLS.filter(c=>c.k!=="t");
  return `<p><a class="mut" href="javascript:history.back()">← Indietro</a></p>
  <div class="co-head"><div><h1>${esc(i.name)}</h1>
    <div class="co-meta"><code>${esc(t)}</code>${i.isin?`<code>${esc(i.isin)}</code>`:`<span class="mut">ISIN n.d.</span>`}<span class="mkt">${esc(MKT_LBL[i.panel]||i.panel)}</span>${i.idx.map(x=>`<span class="pill p-nt">${esc(IDX_LBL[x]||x)}</span>`).join("")}${i.cur?`<span>${esc(i.cur)}</span>`:""}</div></div>
    <div class="px">${l?`<div class="v">${nf(l[1])}</div><div class="${pcls(ch)}">${pct(ch,2)} <span class="mut">chiusura ${fd(l[0])}</span></div>`:`<div class="mut">Prezzo non ancora disponibile</div>`}
    <button class="btn ${inW?"on":""}" style="margin-top:10px" data-wl="${esc(t)}">${inW?"★ In watchlist":"☆ Aggiungi alla watchlist"}</button></div></div>
  <div class="grid two">
    <div class="card"><div class="hd"><h2>Prezzo e target</h2><small>${series&&series.d.length?`${fd(series.d[0])} – ${fd(series.d.at(-1))}`:""}</small></div>
      ${series&&series.d.length>1?chart(series,ev,mean):`<div class="empty-state">Lo storico prezzi arriva con il prossimo snapshot notturno.</div>`}
      <div class="legend"><span><i style="background:var(--acc)"></i>Chiusura</span><span><i style="background:var(--up)"></i>Target alzato</span><span><i style="background:var(--dn)"></i>Target tagliato</span><span><i style="background:var(--info)"></i>Target nuovo/confermato</span><span><i style="background:var(--warn);border-radius:0;height:2px;width:14px;vertical-align:3px"></i>Target medio</span></div></div>
    <div class="card"><div class="hd"><h2>Consenso</h2><small>${bc.length} broker, ultimi 12 mesi</small></div><div class="bd">
      <div class="stat"><span>Target medio</span><b>${nf(mean)}</b></div>
      <div class="stat"><span>Upside vs ultima chiusura</span><b class="${pcls(up)}">${pct(up)}</b></div>
      <div class="stat"><span>Rating medio (1 = Strong Buy, 5 = Sell)</span><b>${nf(avg,2)}</b></div>
      ${rng}
      ${bc.length?"":`<div class="mut" style="font-size:12.5px;margin-top:8px">Yahoo non fornisce i rating dei singoli broker su questo titolo: sono disponibili target di consenso e revisioni.</div>`}
      <div class="dist" ${bc.length?"":'style="display:none"'}>${bc.length?`<div style="width:${100*nb/bc.length}%;background:var(--up)"></div><div style="width:${100*nh/bc.length}%;background:var(--muted);opacity:.45"></div><div style="width:${100*ns/bc.length}%;background:var(--dn)"></div>`:""}</div>
      <div class="mut" style="font-size:12.5px;${bc.length?"":"display:none"}"><span class="up">${nb} Buy</span> · ${nh} Hold · <span class="dn">${ns} Sell</span></div>
      ${rl.length?`<div style="margin-top:14px">${rl.map(r=>{const den=r[5]||(r[3]+r[4]);const b=den?(r[3]-r[4])/den:null;return `<div class="stat"><span>Revisioni EPS ${r[2]===1?"FY corrente":"FY prossimo"} (30g)</span><span><span class="up">${r[3]}↑</span> <span class="dn">${r[4]}↓</span> · <b class="${pcls(b)}">${pct(b==null?null:b*100,0)}</b></span></div>`}).join("")}</div>`:""}

function rangeBar(lo,hi,mean,px){const a=Math.min(lo,px),b=Math.max(hi,px),sp=(b-a)||1,p=v=>(100*(v-a)/sp).toFixed(1)+"%";
  return `<div class="range" title="Intervallo dei target"><div class="m" style="left:${p(lo)};background:var(--dn)"></div>
  <div class="m" style="left:${p(mean)};background:var(--warn)"></div><div class="m" style="left:${p(hi)};background:var(--up)"></div>
  <div class="m" style="left:${p(px)};background:var(--ink);width:4px"></div></div>
  <div class="rleg"><span><i style="background:var(--dn)"></i>Target min ${nf(lo)}</span><span><i style="background:var(--ink)"></i>Prezzo ${nf(px)}</span><span><i style="background:var(--warn)"></i>Target medio ${nf(mean)}</span><span><i style="background:var(--up)"></i>Target max ${nf(hi)}</span></div>`;}

function chart(s,ev,mean){
  const pw=document.getElementById("page").clientWidth-(innerWidth>900?56:32);
  const W=Math.round(Math.max(320,innerWidth>900&&pw>900?(pw-16)/2-2:pw-2)),H=Math.round(W*.46),L=52,R=12,T=12,B=24;const d=s.d,c=s.c;const d0=d[0];
  const pts=ev.filter(e=>e.pt&&e.d>=d0);const vals=[...c,...pts.map(e=>e.pt)];if(mean)vals.push(mean);
  let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*.08||1;mn-=pad;mx+=pad;
  const t0=Date.parse(d0),t1=Date.parse(d.at(-1))||t0+1;
  const X=ds=>L+(W-L-R)*((Date.parse(ds)-t0)/((t1-t0)||1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const line=c.map((v,k)=>`${k?"L":"M"}${X(d[k]).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const area=`${line}L${X(d.at(-1)).toFixed(1)},${H-B}L${X(d0).toFixed(1)},${H-B}Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>mn+(mx-mn)*f);
  const xt=[0,.25,.5,.75,1].map(f=>d[Math.min(d.length-1,Math.round((d.length-1)*f))]);
  const col=e=>{const k=ptChg(e);return k>0?"var(--up)":k<0?"var(--dn)":"var(--info)"};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico prezzo e target">
  <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,v>=1000?0:2)}</text>`).join("")}
  ${xt.map(x=>`<text x="${X(x)}" y="${H-6}" text-anchor="middle">${fd(x)}</text>`).join("")}
  <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>
  ${mean?`<line x1="${L}" x2="${W-R}" y1="${Y(mean)}" y2="${Y(mean)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}
  ${pts.map(e=>`<circle cx="${X(e.d)}" cy="${Y(e.pt)}" r="4.5" fill="${col(e)}" stroke="var(--card)" stroke-width="1.5"><title>${esc(e.b)} · ${fd(e.d)}: target ${nf(e.pt)}${e.pf?" (da "+nf(e.pf)+")":""}${e.cx?" · chiusura "+nf(e.cx):""}</title></circle>`).join("")}
  </svg>`;}

/* ---------- router ---------- */
function navHtml(cur){return PAGES.map(([k,l,ic])=>`<a href="#/${k}" ${cur===k?'aria-current="page"':""}>${svg(ic)}<span>${l}</span></a>`).join("");}
let seq=0;
async function render(){if(!D)return;const my=++seq;
  const [p,...rest]=(location.hash.replace(/^#\/?/,"")||"home").split("/");const arg=rest.join("/");
  const cur=p==="t"?"":p;document.getElementById("nav").innerHTML=navHtml(cur);document.getElementById("bnav").innerHTML=navHtml(cur);
  const f={home:pHome,moves:pMoves,targets:pTargets,revisions:pRevisions,brokers:pBrokers,ranking:pRanking,watchlist:pWatch,pipeline:pPipeline,t:pTicker}[p]||pHome;
  const html=await f(decodeURIComponent(arg||""));if(my!==seq)return;
  document.getElementById("page").innerHTML=html;
  document.title=p==="t"&&U[arg]?`${info(decodeURIComponent(arg)).name} · ASNP`:"ASNP · Analyst Snapshot";}
document.getElementById("page").addEventListener("click",e=>{
  const b=e.target.closest("[data-set]");if(b){const k=b.dataset.set;st[k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;if(k==="mkt"||k==="win")LS.set("asnp."+k,st[k]);st.limit={};render();return;}
  const s=e.target.closest("[data-sort]");if(s){const o=st.sort[s.dataset.sort];if(o.k===s.dataset.k)o.desc=!o.desc;else{o.k=s.dataset.k;o.desc=true;}render();return;}
  const m=e.target.closest("[data-more]");if(m){st.limit[m.dataset.more]=(st.limit[m.dataset.more]||100)+200;render();return;}
  const w=e.target.closest("[data-wl]");if(w){const s=wl(),t=w.dataset.wl;s.has(t)?s.delete(t):s.add(t);LS.set("asnp.wl",[...s]);render();return;}
  const r=e.target.closest("[data-go]");if(r&&!e.target.closest("a")){location.hash="#/"+r.dataset.go;scrollTo(0,0);}});
load();
